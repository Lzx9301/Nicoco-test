// ══════════════════════════════════════════════════
//  CHANGE REQUEST v1
//  quotes/{quoteId}/changeRequests/{crId}
//  本輪：CR 資料結構、CRUD、狀態流程（draft/proposed/approved/rejected/cancelled）、
//  核准後重算 project.currentContractValue、CR → Scope（沿用既有 source/crId 欄位）、Activity Log。
//  不做：客戶端確認、Email、PDF、電子簽名、Agreement Generator、自動修改既有 Payment Milestones、複雜 CR 報表。
// ══════════════════════════════════════════════════

const CR_STATUS_LABELS = { draft:'草稿', proposed:'待確認', approved:'已核准', rejected:'已拒絕', cancelled:'已取消' };
const CR_STATUS_COLOR  = { draft:'var(--ink-30)', proposed:'var(--amber)', approved:'var(--green)', rejected:'var(--red)', cancelled:'var(--ink-30)' };
const CR_STATUS_BG     = { draft:'var(--ink-10)', proposed:'var(--amber-light)', approved:'var(--green-light)', rejected:'#fef2f2', cancelled:'var(--ink-10)' };
const CR_ITEM_TYPE_LABELS = { add:'新增', modify:'修改', remove:'刪除' };
const CR_REQUESTED_BY_LABELS = { client:'客戶提出', internal:'內部提出' };

function genCrItemId() {
  return 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

// 唯一 crNumber：讀取目前所有 CR 的 crNumber，取數字部分最大值 +1，補零 3 位。
// 單一管理員使用，不需要 Transaction / Counter document。
function nextCrNumber() {
  let maxNum = 0;
  changeRequests.forEach(cr => {
    const m = /^CR-(\d+)$/.exec(cr.crNumber || '');
    if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
  });
  return 'CR-' + String(maxNum + 1).padStart(3, '0');
}

function crComputeAmountDelta(items) {
  return items.reduce((s, i) => s + (Number.isFinite(Number(i.amountDelta)) ? Number(i.amountDelta) : 0), 0);
}
function crComputeDurationDelta(items) {
  return items.reduce((s, i) => s + (Number.isFinite(Number(i.durationDeltaDays)) ? Number(i.durationDeltaDays) : 0), 0);
}

function validateCrBuilder() {
  if (!crBuilder) return '尚未開始建立';
  if (!crBuilder.title || !crBuilder.title.trim()) return '標題不可空白';
  if (!crBuilder.items.length) return '至少需要 1 個變更項目';
  for (const i of crBuilder.items) {
    if (!i.name || !i.name.trim()) return '每個變更項目都需要名稱';
    if (!Number.isFinite(Number(i.amountDelta))) return '金額變更必須是有效數字';
    if (!Number.isFinite(Number(i.durationDeltaDays))) return '工期變更必須是有效數字';
  }
  const originalValue = resolvePaymentContractValue();
  const amountDelta = crComputeAmountDelta(crBuilder.items);
  const resultingValue = originalValue + amountDelta;
  if (resultingValue < 0) return `變更後總額不得小於 0（目前將變成 NT$${resultingValue.toLocaleString()}）`;
  return null;
}

// ── Draft Builder：純前端操作，按「建立草稿／儲存草稿」前完全不寫 Firestore ──
function openCrBuilder(existingCr) {
  if (existingCr) {
    crBuilder = {
      id: existingCr.id,
      title: existingCr.title || '',
      description: existingCr.description || '',
      requestedBy: existingCr.requestedBy || 'client',
      requestedAt: (existingCr.requestedAt && existingCr.requestedAt.toDate) ? getLocalDateStr(existingCr.requestedAt.toDate()) : getLocalDateStr(),
      items: (existingCr.items || []).map(i => ({ ...i })),
    };
  } else {
    crBuilder = {
      id: null,
      title: '',
      description: '',
      requestedBy: 'client',
      requestedAt: getLocalDateStr(),
      items: [{ id: genCrItemId(), type: 'add', name: '', description: '', amountDelta: 0, durationDeltaDays: 0 }],
    };
  }
  renderProjectUI();
}
function editCrDraft(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (cr && cr.status === 'draft') openCrBuilder(cr);
}
function closeCrBuilder() {
  crBuilder = null;
  renderProjectUI();
}
function crSetField(field, value) {
  if (!crBuilder) return;
  crBuilder[field] = value;
  renderProjectUI();
}
function crAddItem() {
  if (!crBuilder) return;
  crBuilder.items.push({ id: genCrItemId(), type: 'add', name: '', description: '', amountDelta: 0, durationDeltaDays: 0 });
  renderProjectUI();
}
function crRemoveItem(idx) {
  if (!crBuilder) return;
  if (crBuilder.items.length <= 1) { showToast('至少需要保留 1 個變更項目'); return; }
  crBuilder.items.splice(idx, 1);
  renderProjectUI();
}
function crSetItemField(idx, field, value) {
  if (!crBuilder || !crBuilder.items[idx]) return;
  crBuilder.items[idx][field] = value;
  renderProjectUI();
}

// ── 建立新 CR 或儲存既有 draft 的編輯（draft 才可編輯；儲存時一律重新計算 amountDelta 等衍生欄位）──
async function saveCrDraft() {
  const validationErr = validateCrBuilder();
  if (validationErr) { showToast(`⚠ ${validationErr}`); return; }

  const amountDelta = crComputeAmountDelta(crBuilder.items);
  const durationDeltaDays = crComputeDurationDelta(crBuilder.items);
  const originalContractValue = resolvePaymentContractValue();
  const resultingContractValue = originalContractValue + amountDelta;
  const cleanItems = crBuilder.items.map(i => ({
    id: i.id, type: i.type, name: i.name.trim(), description: i.description || '',
    amountDelta: Number(i.amountDelta), durationDeltaDays: Number(i.durationDeltaDays),
  }));
  const requestedAtTs = firebase.firestore.Timestamp.fromDate(new Date(crBuilder.requestedAt + 'T00:00:00'));

  try {
    const crColl = db.collection('quotes').doc(currentId).collection('changeRequests');

    if (crBuilder.id) {
      // 編輯既有 draft：originalContractValue／resultingContractValue 一律重新抓「目前最新」的專案總額重算，
      // 因為 Draft 尚未送出確認，理應反映其他 CR 核准後帶來的最新基準。
      const existing = changeRequests.find(c => c.id === crBuilder.id);
      if (!existing || existing.status !== 'draft') {
        showToast('⚠ 此 CR 已不是草稿狀態，無法編輯');
        crBuilder = null; renderProjectUI(); return;
      }
      const patch = {
        title: crBuilder.title.trim(), description: crBuilder.description || '',
        requestedBy: crBuilder.requestedBy, requestedAt: requestedAtTs,
        items: cleanItems, amountDelta, durationDeltaDays, originalContractValue, resultingContractValue,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      await crColl.doc(crBuilder.id).update(patch);
      Object.assign(existing, patch, { requestedAt: requestedAtTs });
      showToast(`✓ 已更新 ${existing.crNumber}`);
    } else {
      const crNumber = nextCrNumber();
      const ref = crColl.doc();
      const data = {
        crNumber, title: crBuilder.title.trim(), description: crBuilder.description || '',
        status: 'draft', requestedBy: crBuilder.requestedBy, requestedAt: requestedAtTs,
        items: cleanItems, amountDelta, durationDeltaDays,
        originalContractValue, resultingContractValue,
        scopeIds: [],
        approvedAt: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      const amountText = amountDelta >= 0 ? `+NT$${amountDelta.toLocaleString()}` : `-NT$${Math.abs(amountDelta).toLocaleString()}`;
      const newLog = {
        id: genActivityId(), type: 'change_request',
        content: `建立 ${crNumber}：${data.title}，金額變更 ${amountText}`,
        createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me',
      };
      const batch = db.batch();
      batch.set(ref, data);
      batch.update(db.collection('quotes').doc(currentId), { activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog) });
      await batch.commit();

      changeRequests.push({ id: ref.id, ...data });
      if (!currentData.activityLogs) currentData.activityLogs = [];
      currentData.activityLogs.push(newLog);
      showToast(`✓ 已建立 ${crNumber}`);
      syncTimelineUI();
    }

    crBuilder = null;
    renderProjectUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 儲存失敗：${err.message || err}`);
  }
}

// ── 一般狀態轉換：單次 batch（CR 狀態 + activityLog）──
async function crUpdateStatus(cr, newStatus, firestoreExtra, localExtra, logText) {
  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const crRef = quoteRef.collection('changeRequests').doc(cr.id);
    const newLog = { id: genActivityId(), type: 'change_request', content: logText, createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me' };

    const batch = db.batch();
    batch.update(crRef, { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), ...firestoreExtra });
    batch.update(quoteRef, { activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog) });
    await batch.commit();

    Object.assign(cr, { status: newStatus, ...localExtra });
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);
    showToast(`✓ ${logText}`);
    renderProjectUI();
    syncTimelineUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 更新失敗：${err.message || err}`);
  }
}

async function crSubmitForProposal(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (!cr || cr.status !== 'draft') return;
  if (!confirm(`確定要送出 ${cr.crNumber} 供確認嗎？送出後將無法再編輯項目與金額，如需修改請先退回草稿。`)) return;
  await crUpdateStatus(cr, 'proposed', {}, {}, `${cr.crNumber} 已送出確認`);
}
async function crRevertToDraft(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (!cr || cr.status !== 'proposed') return;
  if (!confirm(`確定要將 ${cr.crNumber} 退回草稿嗎？`)) return;
  await crUpdateStatus(cr, 'draft', {}, {}, `${cr.crNumber} 已退回草稿`);
}
async function crReject(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (!cr || cr.status !== 'proposed') return;
  if (!confirm(`確定要拒絕 ${cr.crNumber} 嗎？此操作不會影響專案總額。`)) return;
  await crUpdateStatus(cr, 'rejected', {}, {}, `${cr.crNumber} 已拒絕`);
}
async function crCancel(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (!cr || cr.status !== 'draft') return;
  if (!confirm(`確定要取消 ${cr.crNumber} 嗎？此操作不會刪除紀錄，僅標記為已取消。`)) return;
  await crUpdateStatus(cr, 'cancelled', {}, {}, `${cr.crNumber} 已取消`);
}

// ── 核准（本輪最重要的動作）：絕不使用 += ；重新讀取全部 CR 並重新加總，單一 batch 原子性寫入 CR 狀態 + 專案金額 + Activity Log。
//    選用 batch 而非 Transaction：changeRequestTotal 是在「寫入前」用一次乾淨的 fresh read 重新算好的完整值
//    （不是依賴讀取到的舊值做增量運算），不需要 Transaction 的樂觀鎖/自動重試機制；
//    batch 本身已保證「CR 狀態」與「專案金額」要嘛一起成功、要嘛一起失敗，不會出現半套狀態。
async function crApprove(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (!cr || cr.status !== 'proposed') return;
  if (!confirm(`確定要核准 ${cr.crNumber} 嗎？核准後金額與項目將無法再修改，如需更正請建立新的需求變更。`)) return;

  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const crColl = quoteRef.collection('changeRequests');

    // 重新讀取所有 CR（不信任本地快取），確保加總以 Firestore 現有資料為準
    const freshSnap = await crColl.get();
    const freshCrs = freshSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    let changeRequestTotal = 0;
    freshCrs.forEach(c => {
      const effectiveStatus = c.id === crId ? 'approved' : c.status; // 這筆 CR 核准後也要算進去
      if (effectiveStatus === 'approved') changeRequestTotal += Number(c.amountDelta) || 0;
    });

    const baseContractAmount = Number(currentData.project && currentData.project.contractAmount) || 0;
    const currentContractValue = baseContractAmount + changeRequestTotal;
    const approvedAtLocal = firebase.firestore.Timestamp.now();

    const newLog = {
      id: genActivityId(), type: 'change_request',
      content: `${cr.crNumber} 已核准，目前專案總額更新為 NT$${currentContractValue.toLocaleString()}`,
      createdAt: approvedAtLocal, createdBy: 'me',
    };

    const batch = db.batch();
    batch.update(crColl.doc(crId), {
      status: 'approved',
      approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    batch.update(quoteRef, {
      'project.changeRequestTotal': changeRequestTotal,
      'project.currentContractValue': currentContractValue,
      'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog),
    });
    await batch.commit();

    // Firestore 成功後才同步 local state
    Object.assign(cr, { status: 'approved', approvedAt: approvedAtLocal });
    currentData.project = currentData.project || {};
    currentData.project.changeRequestTotal = changeRequestTotal;
    currentData.project.currentContractValue = currentContractValue;
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);

    showToast(`✓ ${cr.crNumber} 已核准`);
    renderProjectUI();
    syncTimelineUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 核准失敗：${err.message || err}`);
  }
}

// ── CR → Scope：只有 approved CR 才能建立，沿用既有 Scope 資料模型的 source/crId 欄位；
//    不自動展開 Task（沿用「展開成開發任務」永遠是獨立人工動作的既有原則）。
async function createScopeFromCR(crId) {
  const cr = changeRequests.find(c => c.id === crId);
  if (!cr || cr.status !== 'approved') return;
  if (!currentData.project) { showToast('⚠ 尚未建立專案，無法建立工作範圍'); return; }

  const already = (cr.scopeIds || []).length > 0;
  const confirmMsg = already
    ? `${cr.crNumber} 已經建立過追加工作範圍，確定要再建立一個嗎？`
    : `確定要為 ${cr.crNumber} 建立追加工作範圍「${cr.title}」嗎？（僅建立工作範圍，不會自動展開工作項目）`;
  if (!confirm(confirmMsg)) return;

  try {
    const maxOrder = projectScopes.reduce((mx, s) => Math.max(mx, s.order || 0), 0);
    const mapped = SCOPE_TASK_TEMPLATE_MAP[cr.title];
    const taskTemplateKey = mapped ? mapped.tpl : 'minor_addon';

    const scopeColl = db.collection('quotes').doc(currentId).collection('scopes');
    const scopeRef = scopeColl.doc();
    const scopeData = {
      name: cr.title, description: cr.description || '',
      source: 'change_request', crId: cr.id, sourceQuoteItem: null,
      active: true, includeInProgress: true, order: maxOrder + 10,
      taskTemplateKey, tasksGenerated: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    const newScopeIds = [...(cr.scopeIds || []), scopeRef.id];
    const newLog = {
      id: genActivityId(), type: 'change_request',
      content: `已從 ${cr.crNumber} 建立追加工作範圍：${cr.title}`,
      createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me',
    };

    const batch = db.batch();
    batch.set(scopeRef, scopeData);
    batch.update(db.collection('quotes').doc(currentId).collection('changeRequests').doc(crId), {
      scopeIds: newScopeIds, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    batch.update(db.collection('quotes').doc(currentId), { activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog) });
    await batch.commit();

    projectScopes.push({ id: scopeRef.id, ...scopeData });
    cr.scopeIds = newScopeIds;
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);
    showToast(`✓ 已建立追加工作範圍：${cr.title}`);
    renderProjectUI();
    syncTimelineUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 建立追加工作範圍失敗：${err.message || err}`);
  }
}

function computeCrSummary() {
  let approvedTotal = 0, inProgress = 0;
  changeRequests.forEach(cr => {
    if (cr.status === 'approved') approvedTotal += Number(cr.amountDelta) || 0;
    if (cr.status === 'draft' || cr.status === 'proposed') inProgress++;
  });
  return { approvedTotal, inProgress };
}

// ── 渲染：Change Requests 卡片（Project 未建立時完全不顯示）──
function renderChangeRequestSection() {
  if (!currentData.project) return '';
  if (crBuilder) return renderCrBuilder();

  const summary = computeCrSummary();
  const sorted = [...changeRequests].sort((a, b) => (b.crNumber || '').localeCompare(a.crNumber || ''));

  return `
    <div class="card">
      <div class="card-title">需求變更</div>

      ${changeRequests.length ? `
      <div class="info-grid" style="margin-bottom:14px">
        <div class="info-box"><div class="info-label">已核准變更金額</div><div class="info-value" style="color:${summary.approvedTotal >= 0 ? 'var(--green)' : 'var(--red)'}">${summary.approvedTotal >= 0 ? '+' : '-'}NT$${Math.abs(summary.approvedTotal).toLocaleString()}</div></div>
        <div class="info-box"><div class="info-label">進行中</div><div class="info-value">${summary.inProgress}</div></div>
      </div>
      ${sorted.map(renderCrRow).join('')}
      ` : `<div style="font-size:12px;color:var(--ink-60);margin-bottom:12px">尚未建立變更需求。</div>`}

      <button class="btn-copy-link" onclick="openCrBuilder()">＋ 建立需求變更</button>
    </div>`;
}

function renderCrRow(cr) {
  const statusLabel = CR_STATUS_LABELS[cr.status] || cr.status;
  const statusColor = CR_STATUS_COLOR[cr.status] || 'var(--ink-30)';
  const statusBg    = CR_STATUS_BG[cr.status] || 'var(--ink-10)';
  const amt = Number(cr.amountDelta) || 0;
  const amountText = amt >= 0 ? `+NT$${amt.toLocaleString()}` : `-NT$${Math.abs(amt).toLocaleString()}`;
  const dur = Number(cr.durationDeltaDays) || 0;
  const durationText = dur === 0 ? '' : (dur > 0 ? `+${dur} 天` : `${dur} 天`);
  const requestedAtStr = (cr.requestedAt && cr.requestedAt.toDate) ? getLocalDateStr(cr.requestedAt.toDate()) : (cr.requestedAt || '—');
  const detailKey = 'cr_' + cr.id;
  const detailOpen = collapsedGroups.has(detailKey); // 借用既有 collapsedGroups Set：預設收合，點擊展開細節

  const actions = [];
  if (cr.status === 'draft') {
    actions.push(`<button class="btn-copy-link" onclick="editCrDraft('${cr.id}')">編輯</button>`);
    actions.push(`<button class="btn-copy-link" onclick="crSubmitForProposal('${cr.id}')">送出確認</button>`);
    actions.push(`<button class="btn-copy-link" style="color:var(--red)" onclick="crCancel('${cr.id}')">取消此需求變更</button>`);
  } else if (cr.status === 'proposed') {
    actions.push(`<button class="btn-copy-link" onclick="crRevertToDraft('${cr.id}')">退回草稿</button>`);
    actions.push(`<button class="btn-copy-link" style="color:var(--green)" onclick="crApprove('${cr.id}')">核准</button>`);
    actions.push(`<button class="btn-copy-link" style="color:var(--red)" onclick="crReject('${cr.id}')">拒絕</button>`);
  } else if (cr.status === 'approved') {
    actions.push(`<button class="btn-copy-link" onclick="createScopeFromCR('${cr.id}')">建立追加工作範圍</button>`);
  }
  actions.push(`<button class="btn-copy-link" onclick="toggleGroupCollapse('${detailKey}')">${detailOpen ? '收合' : '查看詳細'}</button>`);

  const itemDetail = detailOpen ? `
      <div style="margin-top:8px;border-top:1px solid var(--ink-10);padding-top:8px">
        ${(cr.items || []).map(i => `
          <div style="font-size:11.5px;color:var(--ink-60);margin-bottom:4px">
            <span class="dtag" style="margin-right:4px">${CR_ITEM_TYPE_LABELS[i.type] || i.type}</span>
            ${escapeHtml(i.name)}${i.description ? `　${escapeHtml(i.description)}` : ''}
            　<span style="color:${(Number(i.amountDelta)||0)>=0?'var(--green)':'var(--red)'}">${(Number(i.amountDelta)||0)>=0?'+':'-'}NT$${Math.abs(Number(i.amountDelta)||0).toLocaleString()}</span>
          </div>`).join('')}
        ${(cr.scopeIds && cr.scopeIds.length) ? `<div style="font-size:11px;color:var(--ink-30);margin-top:4px">已建立 ${cr.scopeIds.length} 個追加工作範圍</div>` : ''}
      </div>` : '';

  return `
    <div style="border:1.5px solid var(--ink-10);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:180px">
          <div style="font-size:13.5px;font-weight:600;color:var(--ink)">
            ${escapeHtml(cr.crNumber)}　${escapeHtml(cr.title)}
            <span class="dtag" style="margin-left:6px;background:${statusBg};color:${statusColor}">${statusLabel}</span>
          </div>
          <div style="font-size:11px;color:var(--ink-60);margin-top:4px">
            ${CR_REQUESTED_BY_LABELS[cr.requestedBy] || cr.requestedBy}　${requestedAtStr}　${(cr.items || []).length} 個變更項目
          </div>
          <div style="font-size:12px;margin-top:4px">
            <span style="color:${amt >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600">${amountText}</span>
            ${durationText ? `　<span style="color:var(--ink-60)">${durationText}</span>` : ''}
          </div>
          ${cr.status === 'approved'
            ? `<div style="font-size:11px;color:var(--ink-30);margin-top:4px">已核准的變更需求不可直接修改，如需更正請建立新的需求變更。</div>`
            : ''}
          ${itemDetail}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${actions.join('')}</div>
      </div>
    </div>`;
}

        <button class="btn-copy-link" onclick="closeCrBuilder()">取消</button>
        <button class="btn-save" style="padding:9px 18px" onclick="saveCrDraft()">${b.id ? '儲存草稿' : '建立草稿'}</button>
      </div>
    </div>`;
}

// ── settings/studio 快取讀取（承攬方資料來源，同一頁面只讀一次）──
async function getStudioSettings() {
  if (studioSettingsCache) return studioSettingsCache;
  try {
    const snap = await db.collection('settings').doc('studio').get();
    studioSettingsCache = snap.exists ? snap.data() : {};
  } catch (err) {
    console.error('讀取 settings/studio 失敗：', err);
    studioSettingsCache = {};
  }
  return studioSettingsCache;
}

// ── Agreement Number：AGR-{quoteId}-{seq}，quoteId 本身已全域唯一，seq 只需在同一 quote 底下遞增，
//    天生跨案件不重號，不需要 global counter / Transaction ──
function nextAgreementNumber() {
  const prefix = `AGR-${currentId}-`;
  let maxSeq = 0;
  agreements.forEach(a => {
    if (a.agreementNumber && a.agreementNumber.startsWith(prefix)) {
      const m = /-(\d+)$/.exec(a.agreementNumber);
      if (m) maxSeq = Math.max(maxSeq, parseInt(m[1], 10));
    }
  });
  return `${prefix}${String(maxSeq + 1).padStart(3, '0')}`;
}

// ── 合約總額 fallback：project.contractAmount → quotationTotal → officialPrice → 0 ──
function resolveAgreementContractAmount() {
  const proj = currentData.project;
  if (proj && Number(proj.contractAmount) > 0) return { amount: Number(proj.contractAmount), source: 'project.contractAmount' };
  if (Number(currentData.quotationTotal) > 0) return { amount: Number(currentData.quotationTotal), source: 'quotationTotal' };
  if (Number(currentData.officialPrice) > 0) return { amount: Number(currentData.officialPrice), source: 'officialPrice' };
  return { amount: 0, source: 'none' };
}
const AGREEMENT_SOURCE_LABELS = {
  'project.contractAmount': '沿用分期付款合約金額快照',
  'quotationTotal': '沿用正式報價金額',
  'officialPrice': '沿用議定金額',
  'manual': '管理者手動輸入',
  'none': '尚未設定',
};

// ── Scope snapshot 預設值：projectScopes → quotationItems → includedItems/selectedItems → 空
//    三種情況都完全可在 Builder 內自由編輯，不因來源不同而鎖死 ──
function buildScopeSnapshotDefault() {
  if (projectScopes && projectScopes.length) {
    return projectScopes.map(s => ({ name: s.name || '', description: s.description || '', source: s.source || 'initial_scope', crId: s.crId || null }));
  }
  if (currentData.quotationItems && currentData.quotationItems.length) {
    return currentData.quotationItems.map(i => ({ name: i.name || '', description: i.description || '', source: 'quotation_item', crId: null }));
  }
  const estimateNames = [...(currentData.includedItems || []), ...(currentData.selectedItems || [])];
  if (estimateNames.length) {
    return estimateNames.map(name => ({ name, description: '', source: 'quote_estimate', crId: null }));
  }
  return [];
}

// ── Payment Plan snapshot 預設值：有既有 Payment Milestones 就預填（不複製 status/paidAt，
//    Agreement 記錄的是「當初約定的付款計畫」而非「現在付到哪」）；沒有則給一筆可編輯的預設列 ──
function buildPaymentPlanSnapshotDefault(contractAmountSnapshot) {
  if (paymentMilestones && paymentMilestones.length) {
    return [...paymentMilestones].sort((a, b) => (a.order || 0) - (b.order || 0)).map((p, idx) => ({
      order: idx, title: p.title || '', percentage: Number(p.percentage) || 0,
      amount: Number(p.amount) || 0, dueDate: p.dueDate || null, note: p.note || '',
    }));
  }
  return [{ order: 0, title: '全額付款', percentage: 100, amount: contractAmountSnapshot, dueDate: null, note: '' }];
}

// 每次百分比或合約總額變動後重新計算金額：前 N-1 筆四捨五入，最後一筆吸收 rounding difference，
// 沿用既有 Payment Milestone 的 rounding 規則（Σ amount 永遠精確等於合約總額）
function agrRecomputePaymentAmounts() {
  if (!agreementBuilder) return;
  const items = agreementBuilder.paymentPlanSnapshot;
  const contractAmount = Number(agreementBuilder.contractAmountSnapshot) || 0;
  let runningSum = 0;
  items.forEach((item, idx) => {
    if (idx === items.length - 1) {
      item.amount = contractAmount - runningSum;
    } else {
      item.amount = Math.round(contractAmount * (Number(item.percentage) || 0) / 100);
      runningSum += item.amount;
    }
  });
}

// ── Draft Builder：欄位編輯（純前端，未按「建立/儲存草稿」前完全不寫 Firestore）──
function agrSetField(path, value) {
  if (!agreementBuilder) return;
  const parts = path.split('.');
  let obj = agreementBuilder;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = value;

}
function agrSetContractAmount(value) {
  if (!agreementBuilder) return;
  agreementBuilder.contractAmountSnapshot = Number.isFinite(Number(value)) ? Number(value) : 0;
  agreementBuilder.contractAmountSource = 'manual';
  agrRecomputePaymentAmounts();
  renderAgreementUI();
}
function agrAddScopeRow() {

function agrRemoveScopeRow(idx) {

}
function agrSetScopeField(idx, field, value) {

function agrAddPaymentRow() {

  agrRecomputePaymentAmounts();

function agrRemovePaymentRow(idx) {
  if (!agreementBuilder) return;
  if (agreementBuilder.paymentPlanSnapshot.length <= 1) { showToast('至少需要保留 1 筆付款節點'); return; }
  agreementBuilder.paymentPlanSnapshot.splice(idx, 1);
  agrRecomputePaymentAmounts();
  renderAgreementUI();
}
function agrSetPaymentField(idx, field, value) {
  if (!agreementBuilder || !agreementBuilder.paymentPlanSnapshot[idx]) return;
  agreementBuilder.paymentPlanSnapshot[idx][field] = value;
  if (field === 'percentage') agrRecomputePaymentAmounts();
  renderAgreementUI();
}

function validateAgreementBuilder() {
  if (!agreementBuilder) return '尚未開始建立';
  if (!agreementBuilder.client.name && !agreementBuilder.client.company) return '客戶名稱或公司名稱至少填一項';
  if (!agreementBuilder.projectName || !agreementBuilder.projectName.trim()) return '專案名稱不可空白';
  if (!Number.isFinite(Number(agreementBuilder.contractAmountSnapshot)) || Number(agreementBuilder.contractAmountSnapshot) <= 0) return '合約總額必須是大於 0 的有效數字';
  if (!agreementBuilder.paymentPlanSnapshot.length) return '至少需要 1 筆付款節點';
  for (const p of agreementBuilder.paymentPlanSnapshot) {
    if (!p.title || !p.title.trim()) return '每筆付款節點都需要名稱';
    if (!Number.isFinite(Number(p.percentage)) || Number(p.percentage) <= 0) return '每筆付款比例必須大於 0';
  }
  const sumPct = agreementBuilder.paymentPlanSnapshot.reduce((s, p) => s + (Number(p.percentage) || 0), 0);
  if (Math.abs(sumPct - 100) > 0.001) return `付款比例加總必須為 100%（目前為 ${sumPct}%）`;
  const sumAmt = agreementBuilder.paymentPlanSnapshot.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  if (sumAmt !== Number(agreementBuilder.contractAmountSnapshot)) return '付款金額加總與合約總額不符，請重新確認比例';
  return null;
}

// ── 建立新 Agreement 或儲存既有 draft 的編輯 ──
async function saveAgreementDraft() {
  const validationErr = validateAgreementBuilder();
  if (validationErr) { showToast(`⚠ ${validationErr}`); return; }

  const b = agreementBuilder;
  const cleanScope = b.scopeSnapshot.map(s => ({ name: (s.name || '').trim(), description: s.description || '', source: s.source || 'manual', crId: s.crId || null })).filter(s => s.name);
  const cleanPayment = b.paymentPlanSnapshot.map((p, idx) => ({ order: idx, title: (p.title || '').trim(), percentage: Number(p.percentage) || 0, amount: Number(p.amount) || 0, dueDate: p.dueDate || null, note: p.note || '' }));
  const commonPayload = {
    client: b.client, provider: b.provider, projectName: b.projectName.trim(),
    scopeSnapshot: cleanScope,
    contractAmountSnapshot: Number(b.contractAmountSnapshot), contractAmountSource: b.contractAmountSource,
    paymentPlanSnapshot: cleanPayment, timeline: b.timeline,
    paymentTermsText: b.paymentTermsText, changeRequestPolicy: b.changeRequestPolicy,
    acceptancePolicy: b.acceptancePolicy, warrantyPolicy: b.warrantyPolicy,
    thirdPartyFeeNotice: b.thirdPartyFeeNotice, ipDeliverablesPolicy: b.ipDeliverablesPolicy,
    terminationPolicy: b.terminationPolicy, note: b.note,
  };
  // v2.1：合約資料（寫入前重新檢查每一列的狀態是否在允許範圍內）
  if (b.contractData && window.NicocoAgreement) {
    commonPayload.agreementSchemaVersion = NicocoAgreement.SCHEMA_VERSION;
    commonPayload.contractData = NicocoAgreement.toFirestore(b.contractData);
  }

  try {
    const agrColl = db.collection('quotes').doc(currentId).collection('agreements');

    if (b.id) {
      const existing = agreements.find(a => a.id === b.id);
      if (!existing || existing.status !== 'draft') {
        showToast('⚠ 此合約已不是草稿狀態，無法編輯');
        agreementBuilder = null; renderAgreementUI(); return;
      }
      const patch = { ...commonPayload, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      await agrColl.doc(b.id).update(patch);
      Object.assign(existing, patch);
      showToast(`✓ 已儲存草稿 ${existing.agreementNumber}`);
    } else {
      const agreementNumber = nextAgreementNumber();
      const ref = agrColl.doc();
      const data = {
        agreementNumber, quoteId: currentId, status: 'draft',
        ...commonPayload,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        signedAt: null,
      };
      const newLog = {
        id: genActivityId(), type: 'agreement',
        content: `建立合約草稿 ${agreementNumber}：${data.projectName}，合約金額 NT$${data.contractAmountSnapshot.toLocaleString()}`,
        createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me',
      };
      const batch = db.batch();
      batch.set(ref, data);
      batch.update(db.collection('quotes').doc(currentId), { activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog) });
      await batch.commit();

      agreements.push({ id: ref.id, ...data });
      if (!currentData.activityLogs) currentData.activityLogs = [];
      currentData.activityLogs.push(newLog);
      showToast(`✓ 已建立 ${agreementNumber}`);
      syncTimelineUI();
      b.id = ref.id;
    }
    // v2.1：儲存後留在編輯畫面，可繼續預覽、返回編輯、再次儲存草稿（按「關閉」離開）
    if (b.contractData) { b.savedOnce = true; renderAgreementUI(); return; }
    agreementBuilder = null;
    renderAgreementUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 儲存失敗：${err.message || err}`);
  }
}

// ── 狀態轉換：一般 helper（單次 batch：Agreement 狀態 + Activity Log）──
async function agrUpdateStatus(agr, newStatus, extra, logText) {
  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const agrRef = quoteRef.collection('agreements').doc(agr.id);
    const newLog = { id: genActivityId(), type: 'agreement', content: logText, createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me' };

    const batch = db.batch();
    batch.update(agrRef, { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), ...extra });
    batch.update(quoteRef, { activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog) });
    await batch.commit();

    Object.assign(agr, { status: newStatus, ...extra });
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);
    showToast(`✓ ${logText}`);
    renderAgreementUI();
    syncTimelineUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 更新失敗：${err.message || err}`);
  }
}

// 狀態流：draft → ready → signed → active → completed；cancelled 只能從 draft/ready 觸發。
// signed/active/completed 一律鎖死，不允許改回其他狀態、不允許取消。
async function agrMarkReady(id) {
  const a = agreements.find(x => x.id === id); if (!a || a.status !== 'draft') return;
  const missingNote = agrV21ReadyWarning(a);
  if (!confirm(`確定要將 ${a.agreementNumber} 標記為「已備妥」嗎？${missingNote}`)) return;
  await agrUpdateStatus(a, 'ready', {}, `${a.agreementNumber} 已備妥`);
}
async function agrBackToDraft(id) {
  const a = agreements.find(x => x.id === id); if (!a || a.status !== 'ready') return;
  if (!confirm(`確定要將 ${a.agreementNumber} 退回草稿嗎？`)) return;
  await agrUpdateStatus(a, 'draft', {}, `${a.agreementNumber} 已退回草稿`);
}
async function agrMarkSigned(id) {
  const a = agreements.find(x => x.id === id); if (!a || a.status !== 'ready') return;
  if (!confirm(`確定要將 ${a.agreementNumber} 標記為「已簽署」嗎？\n簽署後所有合約內容（客戶/承攬方資料、工作範圍、金額、付款計畫、條款文字）將永久鎖定，不能再編輯，如需更正請建立新的合約。`)) return;
  await agrUpdateStatus(a, 'signed', { signedAt: firebase.firestore.FieldValue.serverTimestamp() }, `${a.agreementNumber} 已簽署`);
}
async function agrMarkActive(id) {
  const a = agreements.find(x => x.id === id); if (!a || a.status !== 'signed') return;
  if (!confirm(`確定要將 ${a.agreementNumber} 標記為「執行中」嗎？`)) return;
  await agrUpdateStatus(a, 'active', {}, `${a.agreementNumber} 已進入執行中`);
}
async function agrMarkCompleted(id) {
  const a = agreements.find(x => x.id === id); if (!a || a.status !== 'active') return;
  if (!confirm(`確定要將 ${a.agreementNumber} 標記為「已完成」嗎？`)) return;
  await agrUpdateStatus(a, 'completed', {}, `${a.agreementNumber} 已完成`);
}
async function agrCancel(id) {
  const a = agreements.find(x => x.id === id); if (!a || (a.status !== 'draft' && a.status !== 'ready')) return;
  if (!confirm(`確定要取消 ${a.agreementNumber} 嗎？此操作不會刪除紀錄，僅標記為已取消。`)) return;
  await agrUpdateStatus(a, 'cancelled', {}, `${a.agreementNumber} 已取消`);
}

function computeAgreementSummary() {
  let draftCount = 0, activeCount = 0;
  agreements.forEach(a => {
    if (a.status === 'draft' || a.status === 'ready') draftCount++;
    if (a.status === 'signed' || a.status === 'active') activeCount++;
  });
  return { draftCount, activeCount, total: agreements.length };
}

// ── 渲染：Agreement 卡片（獨立於 Project 是否建立）──

    agreements = snap.docs.map(d => ({ id: d.id, ...d.data() }));

// ══════════════════════════════════════════════════
//  AGREEMENT GENERATOR v2.1 — 合約資料整合與完整需求附件
//  邏輯在 agreement-data.js（NicocoAgreement）；這裡只負責讀取來源、畫面與編輯狀態。
//  寫入一律走既有 saveAgreementDraft()（只寫 quotes/{id}/agreements/{id} 與 activityLogs），
//  不會寫入 requirementSnapshot／confirmedRequirements／正式報價欄位。
//  來源資料更新時只顯示差異；Admin 按「重新帶入來源資料」並確認後才更新草稿（仍須再按儲存）。
// ══════════════════════════════════════════════════

// 複製 Firestore 資料，保留 Timestamp 物件本身（避免變成一般 map）
function agrV21Clone(v) {
  if (v === null || typeof v !== 'object') return v;
  if (v instanceof firebase.firestore.Timestamp) return v;
  if (Array.isArray(v)) return v.map(agrV21Clone);
  const o = {};
  Object.keys(v).forEach(k => { o[k] = agrV21Clone(v[k]); });
  return o;
}

// 讀取不在案件文件上的來源：需求變更（全部狀態，由邏輯層篩選）與客戶接受報價時的快照
async function agrV21LoadSources() {
  const out = { changeRequests: [], acceptance: null, loadedAt: Date.now(), warnings: [] };
  const quoteRef = db.collection('quotes').doc(currentId);
  try {
    const snap = await quoteRef.collection('changeRequests').get();
    out.changeRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (err) {
    console.error('讀取需求變更失敗：', err);
    out.warnings.push('需求變更清單');
  }
  if (currentData.quotationStatus === 'accepted' && currentData.clientToken) {
    try {
      const acc = await quoteRef.collection('acceptances').doc(currentData.clientToken).get();
      if (acc.exists) out.acceptance = acc.data();
    } catch (err) {
      console.error('讀取客戶接受報價快照失敗：', err);
      out.warnings.push('客戶接受報價快照');
    }
  }
  agrV21Sources = out;
  return out;
}

function agrV21Ready() { return !!window.NicocoAgreement; }

function agrV21CaptureInto(b, previous) {
  if (!agrV21Ready() || !b) return null;
  const src = agrV21Sources || { changeRequests: [], acceptance: null, warnings: ['需求變更清單'] };
  const res = NicocoAgreement.capture({
    quote: currentData,
    acceptance: src.acceptance,
    changeRequests: src.changeRequests,
    pricing: window.NicocoPricing || null,
    review: window.NicocoReview || null,
    capturedAt: firebase.firestore.Timestamp.now(),
    loadWarnings: src.warnings,
  }, previous || null);
  b.contractData = res.data;
  b.resyncReport = res.report;
  return res;
}

// 目前的來源與合約草稿當時帶入的來源相比，有哪些變動（來源尚未載入時回傳 null＝無法判斷）
function agrV21StaleSources(contractData) {
  if (!agrV21Ready() || !contractData || !contractData.sources || !agrV21Sources) return null;
  const now = NicocoAgreement.sourceState(currentData, agrV21Sources.acceptance, agrV21Sources.changeRequests);
  return NicocoAgreement.compareSources(contractData.sources, now);
}

// 舊合約草稿（v2.1 之前建立）：Admin 主動帶入
async function agrV21CaptureNow() {
  const b = agreementBuilder;
  if (!b || b.contractData) return;
  await agrV21LoadSources();
  agrV21CaptureInto(b, null);
  showToast('✓ 已帶入合約資料，確認後請按「儲存草稿」');
  renderAgreementUI();
}

// 重新帶入：需二次確認；人工填寫內容依合約項目識別碼保留；仍需按「儲存草稿」才寫入
async function agrV21Resync() {
  const b = agreementBuilder;
  if (!b || !b.contractData) return;
  if (!confirm('重新帶入會以目前的客戶需求、確認需求、正式報價與已核准變更，重建「合約需求明細」與費用資料。\n\n'
    + '・已填寫的約定內容、不包含、交付成果、驗收依據、備註、待確認事項會依合約項目識別碼保留\n'
    + '・新來源不再允許的狀態會重設，並在畫面上列出\n'
    + '・按下「儲存草稿」前不會寫入\n\n確定要重新帶入嗎？')) return;
  await agrV21LoadSources();
  agrV21CaptureInto(b, b.contractData);
  showToast('✓ 已重新帶入來源資料（尚未儲存）');
  renderAgreementUI();
}

function agrV21SetView(view) {
  if (!agreementBuilder) return;
  agreementBuilder.view = view === 'preview' ? 'preview' : 'edit';
  renderAgreementUI();
  const el = document.getElementById('agreementSection');
  if (el) el.scrollIntoView({ block: 'start' });
}
function agrV21ToggleRow(id) {
  if (agrV21OpenRows.has(id)) agrV21OpenRows.delete(id); else agrV21OpenRows.add(id);
  renderAgreementUI();
}
function agrV21Row(idx) {
  const b = agreementBuilder;
  return (b && b.contractData && b.contractData.items && b.contractData.items[idx]) || null;
}
function agrV21SetStatus(idx, value) {
  const r = agrV21Row(idx);
  if (!r) return;
  const allowed = NicocoAgreement.allowedStatuses(r);
  if (allowed.indexOf(value) === -1) { showToast('⚠ 這個項目不能設為「' + (NicocoAgreement.STATUS[value] || value) + '」'); renderAgreementUI(); return; }
  r.contractStatus = value;
  renderAgreementUI();
}
function agrV21SetItemField(idx, field, value) {
  const r = agrV21Row(idx);
  if (!r || NicocoAgreement.EDITABLE_FIELDS.indexOf(field) === -1) return;
  r[field] = String(value || '');
  renderAgreementUI();
}
function agrV21SetFeeCategory(quotationItemId, value) {
  const b = agreementBuilder;
  if (!b || !b.contractData) return;
  const ov = b.contractData.feeCategoryOverrides || (b.contractData.feeCategoryOverrides = {});
  if (!value) delete ov[quotationItemId];
  else if (NicocoAgreement.FEE_CATEGORIES[value] && value !== 'unclassified') ov[quotationItemId] = value;
  renderAgreementUI();
}

  const A = NicocoAgreement;

}

function agrV21RenderFeeEditor(d) {
  const A = NicocoAgreement;
  const fees = A.buildFees(d, agreementBuilder.contractAmountSnapshot);
  if (fees.mode === 'none') return `<div class="agv-muted">沒有正式報價資料，費用明細無法對應。</div>`;
  if (fees.mode === 'total_only') {
    return `<div class="agv-alert">報價只有總額 ${escapeHtml('NT$' + fees.baseTotal.toLocaleString())}（${fees.baseTotalSource === 'officialPrice' ? '議定金額' : '正式報價'}），沒有費用拆分。各類費用顯示「${A.MANUAL_SPLIT_TEXT}」，合約資料不會自行推算金額。</div>`;
  }
  const opts = (sel) => ['<option value="">依需求資料自動判斷</option>']
    .concat(A.FEE_CATEGORY_ORDER.filter(k => k !== 'unclassified').map(k => `<option value="${k}" ${sel === k ? 'selected' : ''}>${A.FEE_CATEGORIES[k]}</option>`)).join('');
  const ov = d.feeCategoryOverrides || {};
  return `
    <div class="agv-muted">金額來自${fees.quotationSource === 'acceptance' ? '客戶接受報價時的快照' : '正式報價'}，這裡只能調整「分類」，不能修改金額。</div>
    <table class="agv-table">
      <thead><tr><th>報價項目</th><th class="agv-num">金額</th><th>分類</th></tr></thead>
      <tbody>${fees.lines.map(l => `
        <tr>
          <td>${escapeHtml(l.name)}</td>
          <td class="agv-num">${l.pricingPending ? '<span class="agv-warn">待定價</span>' : 'NT$' + Number(l.amount).toLocaleString()}</td>
          <td><select class="field-select agv-cat-select" onchange="agrV21SetFeeCategory('${escapeHtml(l.quotationItemId)}',this.value)">${opts(ov[l.quotationItemId] || '')}</select>
            <div class="agv-muted">${l.categorySource === 'manual' ? '人工指定' : l.autoCategory ? '自動：' + escapeHtml(A.FEE_CATEGORIES[l.autoCategory]) : '<span class="agv-warn">' + escapeHtml(A.FEE_CATEGORIES.unclassified) + '</span>'}</div></td>
        </tr>`).join('')}</tbody>
    </table>`;
}

function agrV21RenderPanel() {

  }

    return `

        <button class="btn-copy-link" onclick="agrV21CaptureNow()">帶入合約資料（v2.1）</button>

    .sort((x, y) => (A.STATUS_ORDER.indexOf(x.r.contractStatus) - A.STATUS_ORDER.indexOf(y.r.contractStatus)) || (x.idx - y.idx));

  const reportBox = rep ? `
      <div class="agv-note">重新帶入結果：保留 ${rep.kept} 項、新增 ${rep.added} 項${rep.removed.length ? `、來源中已不存在 ${rep.removed.length} 項（${rep.removed.map(escapeHtml).join('、')}）` : ''}${rep.statusReset.length ? `；${rep.statusReset.length} 項狀態已重設：${rep.statusReset.map(x => escapeHtml(x.label) + '（' + (A.STATUS[x.from] || x.from) + '→' + (A.STATUS[x.to] || x.to) + '）').join('、')}` : ''}。尚未儲存。</div>` : '';
  return `
    <div class="agv-panel">
      <div class="agv-panel-title">合約資料（v2.1）</div>
      <div class="agv-muted">帶入時的來源版本：${A.sourceSummary(d.sources)}</div>
      ${stale === null ? '<div class="agv-muted">（來源資料載入中，暫時無法比對是否有更新）</div>' : ''}
      ${stale && stale.length ? `
        <div class="agv-alert">來源資料已在帶入後更新，合約草稿目前仍是帶入時的內容，不會自動改寫：
          ${stale.map(s => `<div>・${escapeHtml(s.label)}${s.detail ? '：' + escapeHtml(s.detail) : ''}</div>`).join('')}
          <button class="btn-copy-link" style="margin-top:6px" onclick="agrV21Resync()">檢視後重新帶入來源資料</button>
        </div>` : ''}
      ${(d.loadWarnings || []).length ? `<div class="agv-alert">帶入時讀取失敗：${d.loadWarnings.map(escapeHtml).join('、')}。請按「重新帶入來源資料」。</div>` : ''}
      ${reportBox}

      <div class="agv-sub">合約需求明細</div>
      <div class="agv-muted" style="margin-bottom:6px">只有「已納入開發」與「已確認的後續變更」構成開發義務。客戶曾勾選但未經確認的項目一律為「待確認」。</div>
      <div class="agv-counts">${A.STATUS_ORDER.map(s => `<span class="agv-tag agv-st-${s}">${A.STATUS[s]} ${counts[s] || 0}</span>`).join('')}</div>
      ${indexed.length ? indexed.map(x => agrV21RenderEditRow(x.r, x.idx)).join('') : '<div class="agv-muted">沒有任何需求或報價資料。</div>'}

        <button class="btn-copy-link" onclick="agrV21SetView('preview')">合約資料預覽</button>
        <button class="btn-copy-link" onclick="agrV21Resync()">重新帶入來源資料</button>

}

function agrV21RenderSavedPreview() {

  const body = agrV21Ready()

    : '';

// 標記「已備妥」前的提醒（不阻擋既有流程）
function agrV21ReadyWarning(a) {
  if (!agrV21Ready() || !a || !a.contractData) return '';
  const stale = agrV21StaleSources(a.contractData) || [];
  const req = NicocoAgreement.missingInfo(a, a.contractData, { staleSources: stale }).filter(x => x.level === 'required');
  if (!req.length) return '';
  return `\n\n提醒：合約資料仍有 ${req.length} 項「必要」資訊未完成：\n・${req.map(x => x.text).join('\n・')}\n\n標記已備妥後內容將無法編輯（需退回草稿）。`;
}

// ══════════════════════════════════════════════════
//  ACTIVITY TIMELINE
// ══════════════════════════════════════════════════
function genActivityId() {
  return 'act_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function fmtTimelineTime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' }) +
         ' ' + d.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
}

function toggleTimelineExpanded() {
  timelineExpanded = !timelineExpanded;
  const el = document.getElementById('timelineList');
  if (el) el.innerHTML = renderTimelineList(currentData.activityLogs || []);
}

function renderTimelineList(logs) {
  if (!logs || logs.length === 0) {
    return '<div class="timeline-empty">尚無紀錄，新增第一筆吧。</div>';
  }

  // 由新到舊排序（依 createdAt，Firestore Timestamp 物件需轉成 millis 比較）
  const sorted = [...logs].sort((a, b) => {
    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
    return tb - ta;
  });

  // 資訊密度優化：預設只顯示最近 5 筆，資料本身（sorted 的內容/文字）完全不截斷、不改寫，
  // 只是控制「顯示幾筆」，超過 5 筆才出現展開/收合按鈕。
  const displayLogs = timelineExpanded ? sorted : sorted.slice(0, 5);

  const entriesHtml = displayLogs.map((log, idx) => `
    <div class="timeline-entry">
      <div class="timeline-dot-col">
        <div class="timeline-dot type-${log.type}"></div>
        ${idx < displayLogs.length - 1 ? '<div class="timeline-line"></div>' : ''}
      </div>
      <div class="timeline-body">
        <div class="timeline-meta">
          <span class="timeline-type-tag type-${log.type}">${ACTIVITY_TYPE_LABELS[log.type] || log.type}</span>
          <span class="timeline-time">${fmtTimelineTime(log.createdAt)}</span>
          <span class="timeline-by">by ${escapeHtml(log.createdBy || 'me')}</span>
        </div>
        <div class="timeline-content" style="max-height:4.8em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical" title="${escapeHtml(log.content || '')}">${escapeHtml(log.content || '')}</div>
      </div>
      <button class="timeline-delete-btn" onclick="deleteActivityLog('${log.id}')" title="刪除這筆紀錄">✕</button>
    </div>`).join('');

  const toggleHtml = sorted.length > 5
    ? `<div style="text-align:center;margin-top:10px">
         <button class="btn-copy-link" onclick="toggleTimelineExpanded()">${timelineExpanded ? '收合紀錄' : `查看全部紀錄（${sorted.length}）`}</button>
       </div>`
    : '';

  return entriesHtml + toggleHtml;
}

// ── 新增紀錄：讀取現有 activityLogs 後合併，不覆蓋原資料 ──
async function addActivityLog() {
  if (!currentId) return;

  const typeEl    = document.getElementById('timelineType');
  const contentEl = document.getElementById('timelineContent');
  const btn       = document.getElementById('timelineAddBtn');

  const content = contentEl.value.trim();
  if (!content) { showToast('請輸入紀錄內容'); return; }

  btn.disabled = true;
  btn.textContent = '新增中…';

  const newEntry = {
    id:        genActivityId(),
    type:      typeEl.value,
    content:   content,
    createdAt: firebase.firestore.Timestamp.now(),  // client timestamp（陣列內無法用 serverTimestamp）
    createdBy: 'me',
  };

  try {
    // 用 arrayUnion 合併寫入，不影響文件其他欄位
    await db.collection('quotes').doc(currentId).update({
      activityLogs: firebase.firestore.FieldValue.arrayUnion(newEntry),
    });

    // 同步更新本地快取與畫面
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newEntry);
    document.getElementById('timelineList').innerHTML = renderTimelineList(currentData.activityLogs);

    contentEl.value = '';
    showToast('✓ 已新增紀錄');
  } catch (err) {
    console.error(err);
    showToast(`⚠ 新增失敗：${err.message || err}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '新增紀錄';
  }
}

// ── 刪除紀錄：用 arrayRemove 需要完整物件比對，改用「讀取全部 → 過濾 → 整批寫回」較穩定 ──
async function deleteActivityLog(logId) {
  if (!currentId) return;
  if (!confirm('確定要刪除這筆紀錄嗎？')) return;

  const updatedLogs = (currentData.activityLogs || []).filter(log => log.id !== logId);

  try {
    await db.collection('quotes').doc(currentId).update({
      activityLogs: updatedLogs,
    });

    currentData.activityLogs = updatedLogs;
    document.getElementById('timelineList').innerHTML = renderTimelineList(currentData.activityLogs);
    showToast('✓ 已刪除紀錄');
  } catch (err) {
    console.error(err);
    showToast(`⚠ 刪除失敗：${err.message || err}`);
  }
}

function onProgressInput(val) {
  document.getElementById('progressValue').textContent = `${val}%`;
  document.getElementById('progressFill').style.width = `${val}%`;
  markDirty();
}

function markDirty() {
  dirty = true;

}

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
function tsToLocalInput(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ══════════════════════════════════════════════════
//  SAVE
// ══════════════════════════════════════════════════
async function saveChanges() {
  if (!currentId) return;
  const btn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('saveStatus');

  btn.disabled = true;
  statusEl.textContent = '儲存中…';
  statusEl.className = 'save-status saving';

  const officialPriceRaw = document.getElementById('f-officialPrice').value;
  const lastContactRaw   = document.getElementById('f-lastContactAt').value;

  const payload = {
    officialPrice: officialPriceRaw === '' ? null : Number(officialPriceRaw),
    progress:      Number(document.getElementById('f-progress').value),
    paymentStatus: document.getElementById('f-paymentStatus').value,
    notes:         document.getElementById('f-notes').value,
    status:        document.getElementById('f-status').value,
    priority:      document.getElementById('f-priority').value,
    source:        document.getElementById('f-source').value,
    assignedTo:    document.getElementById('f-assignedTo').value,
    lastContactAt: lastContactRaw ? firebase.firestore.Timestamp.fromDate(new Date(lastContactRaw)) : null,
    updatedAt:     firebase.firestore.FieldValue.serverTimestamp(),
  };

  try {
    await db.collection('quotes').doc(currentId).update(payload);
    dirty = false;
    statusEl.textContent = '✓ 已儲存';
    statusEl.className = 'save-status saved';
    setTimeout(() => { if (!dirty) statusEl.textContent = ''; }, 2500);
  } catch (err) {
    console.error(err);
    statusEl.textContent = '⚠ 儲存失敗';
    statusEl.className = 'save-status error';
    showToast(`⚠ 儲存失敗：${err.message || err}`);
  } finally {
    btn.disabled = false;
  }
}

// 離開頁面前若有未儲存變更，提醒一下
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
// ══════════════════════════════════════════════════
//  COPY QUOTATION LINK
// ══════════════════════════════════════════════════
function copyQuotationLink() {
  // Security v1：連結只帶 clientToken（publicQuotations 的文件 ID）。舊版 token 一律視為失效。
  if (!NicocoQuotation.hasSecureLink(currentData)) {
    showToast(currentData && currentData.clientToken
      ? '⚠ 舊的客戶連結已失效，請到「正式報價」頁面重新儲存一次以產生新的安全連結'
      : '⚠ 此案件尚未產生客戶連結，請先在「正式報價」頁面儲存一次報價');
    return;
  }
  const url = NicocoQuotation.publicUrl(currentData.clientToken);
  navigator.clipboard.writeText(url).then(() => {
    showToast('✓ 客戶連結已複製到剪貼簿');
  }).catch(() => {
    prompt('請手動複製此連結：', url);
  });
}

// ══════════════════════════════════════════════════
//  後台流程與介面整理 v1：流程導覽、下一步建議、正式報價摘要
//  只讀取 currentData／agreements／paymentMilestones 等既有資料來顯示，
//  不寫入 Firestore、不改任何狀態值；判斷邏輯在 admin-workflow.js（NicocoWorkflow）。
// ══════════════════════════════════════════════════
const wfLoad = { agreements: false, project: false };

function wfContext() {
  let paymentSummary = null;
  try { if (currentData && currentData.project && wfLoad.project) paymentSummary = computePaymentSummary(); } catch (e) { paymentSummary = null; }
  return {
    quoteId: currentId,
    agreementsLoaded: wfLoad.agreements,
    agreements,
    projectLoaded: wfLoad.project,
    paymentMilestones,
    paymentSummary,
    now: Date.now(),
  };
}

function wfScrollTo(id) {
  const el = document.getElementById(id) || document.getElementById('projectSection');
  if (!el) return;
  // 收合中的區塊先展開，避免捲到看不見內容的地方
  const fold = el.matches && el.matches('details') ? el : (el.querySelector && el.querySelector(':scope > .card > details.fold'));
  if (fold && !fold.open) fold.open = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('wf-flash'); void el.offsetWidth; el.classList.add('wf-flash');
}

function renderWorkflowPanel() {
  const el = document.getElementById('workflowPanel');
  if (!el || !currentData || !window.NicocoWorkflow) return;
  const wf = NicocoWorkflow.compute(currentData, wfContext());
  const MARK = { done: '✓', current: '●', todo: '○', unknown: '？', na: '－', attention: '！' };
  const steps = wf.stages.map((s, i) => `
    <li>
      <button type="button" class="wf-step is-${s.state}${s.focus ? ' is-focus' : ''}" onclick="wfScrollTo('${s.target}')"
              aria-label="${escapeHtml(s.label)}：${escapeHtml(s.stateText)}，${escapeHtml(s.detail)}">
        <span class="wf-step-name"><span class="wf-step-mark" aria-hidden="true">${MARK[s.state] || ''}</span>${escapeHtml(s.label)}</span>
        <span class="wf-step-state">${escapeHtml(s.stateText)}・${escapeHtml(s.detail)}</span>
      </button>
    </li>${i < wf.stages.length - 1 ? '<li class="wf-arrow" aria-hidden="true">→</li>' : ''}`).join('');
  const n = wf.next;
  let actionHtml = '';
  if (n && n.action) {
    actionHtml = n.action.type === 'link'
      ? `<a class="wf-btn-primary" href="${escapeHtml(n.action.href)}">${escapeHtml(n.action.label)} →</a>`
      : `<button type="button" class="wf-btn-primary" onclick="wfScrollTo('${n.action.target}')">${escapeHtml(n.action.label)} ↓</button>`;
  }
  el.innerHTML = `
    <div class="wf-panel">
      <div class="wf-title">案件流程</div>
      <ol class="wf-steps">${steps}</ol>
      ${n ? `
      <div class="wf-next">
        <div style="flex:1;min-width:220px">
          <div class="wf-next-label">下一步建議（操作指引，不會限制其他操作）</div>
          <div class="wf-next-title">${escapeHtml(n.title)}</div>
          <div class="wf-next-desc">${escapeHtml(n.desc)}</div>
          ${n.notes && n.notes.length ? `<ul class="wf-next-notes">${n.notes.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` : ''}
        </div>
        ${actionHtml}
      </div>` : ''}
    </div>`;
}

// ── 正式報價摘要：依序呈現「需求依據 → 報價明細 → 價格 → 發送 → 客戶回覆」；實際編輯仍在 quote-edit.html ──
function renderQuotationSection() {
  const el = document.getElementById('quotationSection');
  if (!el || !currentData || !window.NicocoWorkflow) return;
  const q = currentData;
  const f = NicocoWorkflow.quotationFacts(q, Date.now());
  const c = f.confirmed;
  const editHref = `quote-edit.html?id=${encodeURIComponent(currentId)}`;

  let basis;
  if (c) {
    const s = c.summary || {};
    basis = `已確認第 ${escapeHtml(c.revision)} 版：納入 ${Number(s.includedCount) || 0}・排除 ${Number(s.excludedCount) || 0}・待人工估價 ${Number(s.manualPricingCount) || 0}`;
  } else if (q.requirementSnapshot) {
    basis = q.requirementReviewDraft ? '需求審核進行中，尚未確認' : '需求尚未審核';
  } else {
    basis = '舊案件（無需求書），沿用既有報價方式';
  }
  let basedOn = '—';
  if (f.hasQuote) basedOn = f.basedOnRevision ? `第 ${escapeHtml(f.basedOnRevision)} 版需求` : (c ? '不是依確認需求產生' : '既有報價方式');

  let totalText = '尚未建立';
  if (f.hasQuote) {
    totalText = `NT$${(Number(q.quotationTotal) || 0).toLocaleString()}`;
    if (f.pending) totalText += `（另有 ${f.pending} 項待填價格，尚未計入）`;
  }
  let statusText = f.statusText;
  if (f.expired) statusText += '（已過有效期限）';
  if (f.status === 'sent' && !f.expired) statusText += '・等待客戶回覆';

  const validText = f.validMs !== null ? new Date(f.validMs).toLocaleDateString('zh-TW') : '未設定';
  const notes = [];
  if (f.revisionStale) notes.push(`需求已重新確認為第 ${escapeHtml(c.revision)} 版，報價仍引用第 ${escapeHtml(f.basedOnRevision)} 版。是否重新產生明細需在正式報價頁主動確認，不會自動覆寫。`);
  if (f.notFromConfirmed && f.status !== 'accepted') notes.push('需求已確認，但目前報價明細不是依確認需求產生；可在正式報價頁選擇是否重新產生。');
  if (f.pending) notes.push(`有 ${f.pending} 項「待填價格」，填寫完成前無法發送給客戶。`);
  if (q.requirementSnapshot && !c && f.hasQuote && f.status !== 'accepted') notes.push('需求尚未審核；也可以沿用既有方式直接報價。');
  if (f.status === 'accepted') notes.push('客戶已接受，正式報價維持鎖定；如需變更請使用「需求變更」或建立新的報價版本。');

  const primaryLabel = !f.hasQuote ? '建立正式報價' : (f.status === 'accepted' ? '查看正式報價（已鎖定）' : '前往正式報價');
  el.innerHTML = `
    <div class="card">
      <div class="qs-grid">
        <div class="qs-box"><div class="qs-label">① 需求依據</div><div class="qs-value">${basis}</div></div>
        <div class="qs-box"><div class="qs-label">② 報價明細依據</div><div class="qs-value">${basedOn}${f.hasQuote ? `・${f.items.length} 項` : ''}</div></div>
        <div class="qs-box"><div class="qs-label">③ 報價總額</div><div class="qs-value">${totalText}</div></div>
        <div class="qs-box"><div class="qs-label">④⑤ 報價狀態</div><div class="qs-value">${escapeHtml(statusText)}</div></div>
        <div class="qs-box"><div class="qs-label">有效期限</div><div class="qs-value">${escapeHtml(validText)}${f.expired ? '（已過期）' : ''}</div></div>
        <div class="qs-box"><div class="qs-label">付款條件</div><div class="qs-value">${escapeHtml(q.paymentTerms || '—')}</div></div>
      </div>
      ${notes.length ? `<div class="qs-note">${notes.map(t => `・${t}`).join('<br>')}</div>` : ''}
      <div class="qs-actions">
        <a class="wf-btn-primary" href="${editHref}">${primaryLabel} →</a>
        ${f.hasQuote ? `<button type="button" class="wf-btn-secondary" onclick="copyQuotationLink()">🔗 複製客戶連結</button>` : ''}
        ${!c && q.requirementSnapshot ? `<button type="button" class="wf-btn-secondary" onclick="wfScrollTo('reviewSection')">前往需求審核</button>` : ''}
      </div>
    </div>`;
}

let wfTimer = null;
let wfHashDone = false;
function scheduleWorkflowRender() {
  if (wfTimer) return;
  wfTimer = setTimeout(() => {
    wfTimer = null;
    try { renderQuotationSection(); renderWorkflowPanel(); } catch (e) { console.error('workflow render failed', e); }
    // 從其他頁面帶 #區塊 進來（例如正式報價頁的「準備合約」），等該區塊載入後再捲動過去
    if (!wfHashDone && location.hash) {
      const id = decodeURIComponent(location.hash.slice(1));
      const ready = (id !== 'agreementSection' || wfLoad.agreements) && (id !== 'projectSection' || wfLoad.project);
      if (ready && document.getElementById(id)) { wfHashDone = true; wfScrollTo(id); }
    }
  }, 0);
}

// 既有的區塊渲染函式維持原樣，只在它們執行後順便更新流程導覽（不改原本行為）
(function installWorkflowHooks() {
  const wrap = (name, after) => {
    const orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function () {
      const r = orig.apply(this, arguments);
      if (r && typeof r.then === 'function') r.then(() => { after && after(); scheduleWorkflowRender(); }, () => scheduleWorkflowRender());
      else { after && after(); scheduleWorkflowRender(); }
      return r;
    };
  };
  wrap('renderDetail');
  wrap('renderReviewSection');
  wrap('renderProjectSection', () => { if (!currentData || !currentData.project) wfLoad.project = true; });
  wrap('renderProjectUI', () => { wfLoad.project = true; });
  wrap('renderAgreementUI', () => { wfLoad.agreements = true; });
  wrap('syncTimelineUI');
})();

// ══════════════════════════════════════════════════
//  AUTH GUARD
// ══════════════════════════════════════════════════
function guardAdmin(onPass) {
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.replace(`admin-login.html?next=${encodeURIComponent(window.location.href)}`);
      return;
    }
    if (!ALLOWED_EMAILS.includes(user.email)) {
      auth.signOut();
      window.location.replace('admin-login.html');
      return;
    }
    const emailEl = document.getElementById('headerEmail');
    if (emailEl) emailEl.textContent = user.email;
    onPass();
  });
}
async function signOut() {
  await auth.signOut();
  window.location.replace('admin-login.html');
}

guardAdmin(loadDetail);
</script>
