async function loadDetail() {
  currentId = getIdFromUrl();
  const wrap = document.getElementById('wrap');

  if (!currentId) {
    wrap.innerHTML = '<div class="error-state">⚠ 網址缺少案件 id 參數（例如 ?id=Q-20260701-123）</div>';
    return;
  }

  try {
    const docSnap = await db.collection('quotes').doc(currentId).get();
    if (!docSnap.exists) {
      wrap.innerHTML = `<div class="error-state">⚠ 找不到案件：${escapeHtml(currentId)}</div>`;
      return;

    currentData = docSnap.data();

    console.error(err);

function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' }) +
         ' ' + d.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
}

function fmtPriceRange(q) {
  if (q.priceMid === null || q.priceMid === undefined) return '需評估';
  return `NT$${Number(q.priceMid).toLocaleString()}（${q.priceRange || '—'}）`;
}

// ── Requirement + Estimate v1：客戶原始需求（唯讀）──
// requirementSnapshot 只在客戶送出估價時寫入一次；本頁沒有任何寫入此欄位的程式碼。
// 舊案件沒有此欄位時只顯示說明文字，不報錯、不 backfill。
function renderRequirementSnapshotCard(q) {
  const snap = q && q.requirementSnapshot;
  let body;
  if (!snap) {
    body = '<div class="tag-empty">此案件建立於需求書功能之前</div>';
  } else if (!window.NicocoRequirements || !Array.isArray(snap.categories)) {
    body = '<div class="tag-empty">⚠ 無法顯示需求內容（需求模組未載入或資料格式不符），原始資料仍完整保存於 requirementSnapshot。</div>';
  } else {
    const submitted = snap.submittedAt ? fmtDate(snap.submittedAt) : (snap.submittedAtClient || '—');
    body = `
      <div style="font-size:12px;color:var(--ink-60);line-height:1.6;margin-bottom:12px">
        原始紀錄，不會因後續審核而修改。客戶送出時的原始需求（唯讀，送出時間 ${escapeHtml(submitted)}）。此內容不會被後續管理操作修改；討論後確認的正式需求將另外記錄。
        ${snap.requiresManualReview ? '<br><span style="color:var(--amber);font-weight:600">⚠ 包含需人工確認的需求，尚未列入正式工作範圍。</span>' : ''}
      </div>
      ${window.NicocoRequirements.renderSnapshotHtml(snap, { mode: 'admin' })}`;
  }
  // 長篇內容：需求已確認後預設收合（仍可隨時展開查看）；尚未確認時預設展開，方便審核對照
  const hint = !snap ? '（舊案件）'
    : (q.confirmedRequirements ? '（需求已確認，展開查看原始紀錄）' : '（唯讀，審核時對照用）');
  return `
    <div class="card">
      <details class="fold"${(!snap || !q.confirmedRequirements) ? ' open' : ''}>
        <summary>客戶原始需求 <span class="fold-hint">${hint}</span></summary>
        ${body}
      </details>
    </div>`;
}

let reviewWork = null;            // 工作稿的本地編輯副本（按「儲存工作稿」或「確認需求」才寫入）

function reviewMoney(n) { return 'NT$' + Number(n || 0).toLocaleString(); }
function reviewRange(a, b) { return reviewMoney(a) + ' – ' + reviewMoney(b); }
function reviewTs(ts) { return ts ? fmtDate(ts) : '—'; }
function reviewNow() { return firebase.firestore.Timestamp.now(); }
function reviewAdminEmail() { return (auth.currentUser && auth.currentUser.email) || ''; }
function reviewLog(content) {
  return { id: genActivityId(), type: 'requirement', content, createdAt: reviewNow(), createdBy: 'me' };
}
function reviewPushLog(log) {
  if (!currentData.activityLogs) currentData.activityLogs = [];

  return NicocoReview.summarize(reviewWork.items, reviewWork.baseRange, reviewWork.warrantyFee);

// ── 開始需求審核：Snapshot → 工作稿（不修改 Snapshot）──
async function startRequirementReview() {
  if (reviewBusy || !currentData.requirementSnapshot) return;
  if (!window.NicocoReview || !window.NicocoPricing) { showToast('⚠ 需求審核模組未載入，請重新整理頁面'); return; }
  reviewBusy = true;
  try {
    const draft = NicocoReview.createDraftFromSnapshot(currentData, NicocoPricing);
    draft.createdAt = reviewNow(); draft.updatedAt = draft.createdAt;
    const log = reviewLog(`開始需求審核（共 ${draft.items.length} 項，其中 ${draft.items.filter(i => i.category === 'attention').length} 項需要處理）`);
    await db.collection('quotes').doc(currentId).update({
      requirementReviewDraft: draft,
      activityLogs: firebase.firestore.FieldValue.arrayUnion(log),
    });
    currentData.requirementReviewDraft = draft;
    reviewWork = null; reviewDirty = false; reviewProblems = [];
    reviewPushLog(log);
    showToast('✓ 已建立需求審核工作稿');
  } catch (err) {
    console.error(err); showToast(`⚠ 建立失敗：${err.message || err}`);
  } finally { reviewBusy = false; renderReviewSection(); }
}

async function saveReviewDraft(silent) {
  if (reviewBusy || !reviewWork) return false;
  reviewBusy = true;
  try {
    const draft = { ...reviewWork, summary: reviewSummary(), updatedAt: reviewNow() };
    await db.collection('quotes').doc(currentId).update({ requirementReviewDraft: draft });
    currentData.requirementReviewDraft = draft; reviewWork = JSON.parse(JSON.stringify(draft));
    reviewWork.createdAt = draft.createdAt; reviewWork.updatedAt = draft.updatedAt;
    reviewDirty = false;
    if (!silent) showToast('✓ 已儲存工作稿');
    return true;
  } catch (err) {
    console.error(err); showToast(`⚠ 儲存失敗：${err.message || err}`); return false;
  } finally { reviewBusy = false; renderReviewSection(); }
}

async function discardReviewDraft() {
  if (reviewBusy) return;
  const hasConfirmed = !!currentData.confirmedRequirements;
  if (!confirm(hasConfirmed
      ? '確定要放棄這次重新開啟的修改嗎？目前有效的正式需求不會受影響。'
      : '確定要刪除需求審核工作稿嗎？客戶原始需求不會受影響，可以重新開始審核。')) return;
  reviewBusy = true;
  try {
    const log = reviewLog(hasConfirmed ? '已放棄重新開啟的需求審核工作稿' : '已刪除需求審核工作稿');
    await db.collection('quotes').doc(currentId).update({
      requirementReviewDraft: firebase.firestore.FieldValue.delete(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(log),
    });
    delete currentData.requirementReviewDraft; reviewWork = null; reviewDirty = false; reviewProblems = [];
    reviewPushLog(log);
  } catch (err) {
    console.error(err); showToast(`⚠ 操作失敗：${err.message || err}`);
  } finally { reviewBusy = false; renderReviewSection(); }
}

// ── 確認需求：工作稿 → confirmedRequirements ──
async function confirmRequirements() {
  if (reviewBusy || !reviewWork) return;
  reviewProblems = NicocoReview.validate(reviewWork.items);
  if (reviewProblems.length) {
    renderReviewSection();
    showToast(`⚠ 尚有 ${reviewProblems.length} 類問題需要處理，請見審核區上方說明`);
    return;
  }
  const s = reviewSummary();
  const isRe = !!currentData.confirmedRequirements;
  if (!confirm(
    `確認需求（第 ${reviewWork.revision} 版）\n\n` +
    `基本包含：${s.basicCount} 項\n加價需求：${s.pricedCount} 項\n待人工估價：${s.manualPricingCount} 項\n排除：${s.excludedCount} 項\n` +
    `預估價格區間：${reviewRange(s.totalMin, s.totalMax)}${s.manualPricingCount ? '（不含待人工估價項目）' : ''}\n\n` +
    '確認後，本版需求將作為正式報價依據。客戶原始需求不會被修改。')) return;

  reviewBusy = true;
  try {
    const confirmed = NicocoReview.buildConfirmed(reviewWork, reviewAdminEmail(), firebase.firestore.FieldValue.serverTimestamp());
    const log = reviewLog(isRe
      ? `需求已重新確認（第 ${confirmed.revision} 版）：納入 ${s.includedCount} 項、排除 ${s.excludedCount} 項、待人工估價 ${s.manualPricingCount} 項`
      : `需求已確認（第 ${confirmed.revision} 版）：納入 ${s.includedCount} 項、排除 ${s.excludedCount} 項、待人工估價 ${s.manualPricingCount} 項`);
    const patch = {
      confirmedRequirements: confirmed,
      requirementReviewDraft: firebase.firestore.FieldValue.delete(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(log),
    };
    // 保留上一個確認版本（只保留一份）。Rules 會檢查它必須等於寫入前的 confirmedRequirements。
    if (isRe) patch.previousConfirmedRequirements = currentData.confirmedRequirements;
    const ref = db.collection('quotes').doc(currentId);
    await ref.update(patch);

    // 重新讀取：confirmedAt 是伺服器時間，下次重新確認時需要與 Firestore 上的內容完全一致
    const fresh = await ref.get();
    const d = fresh.data();
    currentData.confirmedRequirements = d.confirmedRequirements;
    currentData.previousConfirmedRequirements = d.previousConfirmedRequirements;
    delete currentData.requirementReviewDraft;
    reviewWork = null; reviewDirty = false; reviewProblems = []; reviewConfirmedOpen = false;
    reviewPushLog(log);
    showToast(`✓ 需求已確認（第 ${confirmed.revision} 版）`);
  } catch (err) {
    console.error(err); showToast(`⚠ 確認失敗：${err.message || err}`);
  } finally { reviewBusy = false; renderReviewSection(); }
}

// ── 重新開啟：不解鎖 confirmedRequirements，只是複製成新的工作稿 ──
async function reopenRequirementReview() {
  if (reviewBusy || !currentData.confirmedRequirements) return;
  const reason = document.getElementById('rv-reopen-reason').value;
  const note = document.getElementById('rv-reopen-note').value.trim();
  if (!reason) { showToast('請選擇重新開啟的理由'); return; }
  if (reason === '其他' && !note) { showToast('選擇「其他」時請填寫說明'); return; }
  reviewBusy = true;
  try {
    const c = currentData.confirmedRequirements;
    const draft = NicocoReview.createDraftFromConfirmed(JSON.parse(JSON.stringify(c)), reason, note);
    draft.createdAt = reviewNow(); draft.updatedAt = draft.createdAt;
    draft.reopenedAt = draft.createdAt; draft.reopenedBy = reviewAdminEmail();
    const log = reviewLog(`重新開啟需求審核（由第 ${c.revision} 版）：${reason}${note ? '｜' + note : ''}`);
    await db.collection('quotes').doc(currentId).update({
      requirementReviewDraft: draft,
      activityLogs: firebase.firestore.FieldValue.arrayUnion(log),
    });
    currentData.requirementReviewDraft = draft;
    reviewWork = null; reviewDirty = false; reviewReopenOpen = false; reviewProblems = [];
    reviewPushLog(log);
    showToast(`✓ 已重新開啟審核（工作稿 第 ${draft.revision} 版）`);
  } catch (err) {
    console.error(err); showToast(`⚠ 重新開啟失敗：${err.message || err}`);
  } finally { reviewBusy = false; renderReviewSection(); }
}

// ── 畫面 ──
function reviewTag(text, bg, color) {
  return `<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${bg};color:${color};font-weight:500;white-space:nowrap">${escapeHtml(text)}</span>`;
}
function reviewItemTags(it) {
  const tags = [];
  if (it.sourceType === 'admin_custom') tags.push(reviewTag('自訂需求', 'var(--ink-10)', 'var(--ink-60)'));
  if (it.pricingMode === 'feature') tags.push(reviewTag('加價', 'var(--accent-light)', 'var(--accent)'));
  else if (it.pricingMode === 'evaluate') tags.push(reviewTag('待評估', 'var(--amber-light)', 'var(--amber)'));
  else if (it.pricingMode === 'manual') tags.push(reviewTag('人工定價', 'var(--amber-light)', 'var(--amber)'));
  else tags.push(reviewTag('基本包含', 'var(--green-light)', 'var(--green)'));
  if ((it.thirdParty || []).length) tags.push(reviewTag('第三方服務', 'var(--ink-10)', 'var(--ink-60)'));
  return tags.join(' ');
}
function reviewEstimateText(it) {
  if (it.requiresManualPricing) return '<span style="color:var(--amber);font-weight:600">待人工估價</span>';
  if (it.pricingMode === 'feature') return `${reviewRange(it.estimatedMin, it.estimatedMax)}`;
  return '<span style="color:var(--ink-30)">含於基礎建置</span>';
}
function reviewSummaryHtml(s) {
  const box = (label, value, warn) => `<div class="info-box"><div class="info-label">${label}</div><div class="info-value"${warn ? ' style="color:var(--amber)"' : ''}>${value}</div></div>`;
  return `
    <div class="info-grid" style="margin-bottom:10px">
      ${box('基本包含', s.basicCount)}${box('加價需求', s.pricedCount)}
      ${box('待人工估價', s.manualPricingCount, s.manualPricingCount > 0)}${box('第三方服務', s.thirdPartyCount)}
      ${box('尚待處理', s.pendingCount, s.pendingCount > 0)}${box('排除', s.excludedCount)}
    </div>
    <div style="background:var(--ink-10);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.8;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between"><span style="color:var(--ink-60)">基礎方案估價</span><span>${reviewRange(s.baseMin, s.baseMax)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--ink-60)">追加功能估價</span><span>${reviewRange(s.addonMin, s.addonMax)}</span></div>
      ${s.warrantyFee ? `<div style="display:flex;justify-content:space-between"><span style="color:var(--ink-60)">保固延長</span><span>${reviewMoney(s.warrantyFee)}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--ink-30);margin-top:4px;padding-top:4px"><span>目前預估總額</span><span>${reviewRange(s.totalMin, s.totalMax)}</span></div>
      ${s.manualPricingCount ? `<div style="font-size:11px;color:var(--amber);margin-top:2px">另有 ${s.manualPricingCount} 項待人工估價，未計入以上金額。</div>` : ''}
      <div style="font-size:11px;color:var(--ink-30);margin-top:2px">估價區間取自既有價格資料，僅供審核參考；正式單價在「正式報價」決定。</div>

}
function reviewSourceHtml(it) {
  const text = it.sourceType === 'admin_custom' ? '（管理者新增，非客戶原始需求）' : (it.sourceText || '—');
  return `<div style="background:var(--ink-10);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-60);line-height:1.6;white-space:pre-wrap">${escapeHtml(text)}</div>`;
}
function reviewDecisionHtml(it, idx) {
  const colors = { included: 'var(--green)', excluded: 'var(--red)', pending: 'var(--amber)' };
  return ['included', 'excluded', 'pending'].map(d => {
    const on = it.decision === d;
    return `<button type="button" onclick="reviewSetDecision(${idx},'${d}')"
      style="font:inherit;font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;margin-right:6px;
             border:1.5px solid ${on ? colors[d] : 'var(--ink-10)'};background:${on ? colors[d] : 'var(--white)'};color:${on ? '#fff' : 'var(--ink-60)'}">${REVIEW_DECISION_LABELS[d]}</button>`;
  }).join('');
}
function reviewCustomPricingHtml(it, idx) {
  const priced = [];
  Object.keys(NicocoPricing.FEATURES).forEach(g => NicocoPricing.FEATURES[g].forEach(f => {
    if (f.evaluate || f.free || !f.price) return;
    priced.push({ key: g + '/' + f.id, name: f.name, min: f.price, max: NicocoPricing.itemHigh(f) });
  }));
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
      <select class="field-select" id="rv-mode-${idx}" style="max-width:220px" onchange="reviewSetCustomPricing(${idx})">
        <option value="manual" ${it.pricingMode === 'manual' ? 'selected' : ''}>人工定價（報價時填價格）</option>
        <option value="evaluate" ${it.pricingMode === 'evaluate' ? 'selected' : ''}>待評估</option>
        <option value="feature" ${it.pricingMode === 'feature' ? 'selected' : ''}>參考既有計價項目</option>
        <option value="base" ${it.pricingMode === 'base' ? 'selected' : ''}>含於基礎建置（不另計價）</option>
      </select>
      <select class="field-select" id="rv-ref-${idx}" style="max-width:320px;display:${it.pricingMode === 'feature' ? 'block' : 'none'}" onchange="reviewSetCustomPricing(${idx})">
        ${priced.map(p => `<option value="${escapeHtml(p.key)}" ${it.pricingKey === p.key ? 'selected' : ''}>${escapeHtml(p.name)}（${reviewRange(p.min, p.max)}）</option>`).join('')}

    </div>`;
}
function reviewItemHtml(it, idx) {
  const custom = it.sourceType === 'admin_custom';
  const border = it.decision === 'pending' ? 'var(--amber)' : it.decision === 'excluded' ? 'var(--ink-30)' : 'var(--ink-10)';
  const tp = (it.thirdParty || []).map(t => `${escapeHtml(t.label)}（${escapeHtml(REVIEW_3P_LABELS[t.responsibilityType] || t.responsibilityType)}）`).join('、');
  return `
    <div style="border:1.5px solid ${border};border-radius:10px;padding:12px 14px;margin-bottom:10px;${it.decision === 'excluded' ? 'opacity:.7' : ''}">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <div style="min-width:0;flex:1">
          ${custom
            ? `<input class="field-input" placeholder="需求名稱" value="${escapeHtml(it.label)}" oninput="reviewSetText(${idx},'label',this.value)">`
            : `<div style="font-size:14px;font-weight:600;color:var(--ink)">${escapeHtml(it.label)}</div>`}
          <div style="margin-top:5px">${reviewItemTags(it)} <span style="font-size:11px;color:var(--ink-30)">${escapeHtml(it.groupLabel || '')}</span></div>

      ${it.unresolvedReason ? `<div style="font-size:12px;color:var(--amber);margin-bottom:8px">⚠ ${escapeHtml(it.unresolvedReason)}</div>` : ''}
      <div class="info-label" style="margin-bottom:4px">客戶原始選擇／描述（唯讀）</div>

      ${custom ? `<div class="info-label" style="margin-top:10px">計價方式</div>${reviewCustomPricingHtml(it, idx)}` : ''}

      <div>${reviewDecisionHtml(it, idx)}${custom ? `<button type="button" onclick="reviewDeleteCustom(${idx})" style="font:inherit;font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;border:1.5px solid var(--ink-10);background:var(--white);color:var(--red);float:right">刪除</button>` : ''}</div>
      <div class="info-label" style="margin:10px 0 4px">正式需求描述</div>
      <textarea class="field-textarea" style="min-height:52px" placeholder="這項需求正式要做的內容" oninput="reviewSetText(${idx},'finalDescription',this.value)">${escapeHtml(it.finalDescription || '')}</textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
        <div><div class="info-label" style="margin-bottom:4px">工作範圍備註</div>
          <input class="field-input" value="${escapeHtml(it.scopeNote || '')}" placeholder="範圍、限制、不包含" oninput="reviewSetText(${idx},'scopeNote',this.value)"></div>
        <div><div class="info-label" style="margin-bottom:4px">內部備註</div>
          <input class="field-input" value="${escapeHtml(it.adminNote || '')}" placeholder="只有後台看得到" oninput="reviewSetText(${idx},'adminNote',this.value)"></div>
      </div>

}
function reviewBasicRowHtml(it, idx) {

function reviewReadonlyListHtml(c) {
  const inc = (c.items || []).filter(i => i.decision === 'included');

function renderReviewSection() {
  const el = document.getElementById('reviewSection');
  if (!el || !currentData) return;
  const q = currentData;
  const draft = q.requirementReviewDraft;
  const confirmed = q.confirmedRequirements;
  const btn = 'font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1.5px solid var(--ink-10);background:var(--white);color:var(--ink)';
  let body = '';

  if (!q.requirementSnapshot && !draft && !confirmed) {
    el.innerHTML = `<div class="card"><div class="card-title">需求審核</div><div class="tag-empty">此案件沒有需求書，不適用需求審核。正式報價與專案流程照原本方式進行。</div></div>`;
    return;
  }

  const confirmedHeader = confirmed ? `
    <div style="background:var(--green-light);border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#166534;line-height:1.7">
      <strong>需求已確認</strong>　第 ${escapeHtml(confirmed.revision)} 版　確認於 ${escapeHtml(reviewTs(confirmed.confirmedAt))}${confirmed.confirmedBy ? `　${escapeHtml(confirmed.confirmedBy)}` : ''}
      <div style="font-size:12px">納入 ${confirmed.summary.includedCount} 項・排除 ${confirmed.summary.excludedCount} 項・待人工估價 ${confirmed.summary.manualPricingCount} 項・預估 ${reviewRange(confirmed.summary.totalMin, confirmed.summary.totalMax)}</div>
      ${q.previousConfirmedRequirements ? `<div style="font-size:11.5px;opacity:.8">上一版：第 ${escapeHtml(q.previousConfirmedRequirements.revision)} 版（確認於 ${escapeHtml(reviewTs(q.previousConfirmedRequirements.confirmedAt))}，僅保留這一份歷史）</div>` : ''}
    </div>` : '';

  if (draft) {
    if (!reviewWork) { reviewWork = JSON.parse(JSON.stringify(draft)); reviewWork.createdAt = draft.createdAt; reviewWork.updatedAt = draft.updatedAt; reviewDirty = false; }
    const s = reviewSummary();
    const idxOf = cat => reviewWork.items.map((it, idx) => ({ it, idx })).filter(x => x.it.category === cat);
    const attention = idxOf('attention'), priced = idxOf('priced'), basic = idxOf('basic');
    body = `
      ${confirmed ? confirmedHeader.replace('需求已確認', `目前有效：需求已確認`) : ''}
      <div style="font-size:12.5px;color:var(--ink-60);line-height:1.6;margin-bottom:12px">
        審核工作稿　第 ${escapeHtml(reviewWork.revision)} 版${reviewWork.reopenedFromRevision ? `（由第 ${escapeHtml(reviewWork.reopenedFromRevision)} 版重新開啟：${escapeHtml(reviewWork.reopenReason || '')}${reviewWork.reopenNote ? '｜' + escapeHtml(reviewWork.reopenNote) : ''}）` : ''}
        ・依據需求書版本 ${escapeHtml(reviewWork.sourceSnapshotDefinitionVersion || '—')}。這裡的修改不會影響客戶原始需求${confirmed ? '，也不會影響目前有效的正式需求，直到你重新確認' : ''}。
      </div>
      ${reviewSummaryHtml(s)}
      ${reviewProblems.length ? `<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#991b1b;line-height:1.7"><strong>尚無法確認需求：</strong>${reviewProblems.map(p => `<div>・${escapeHtml(p.message)}</div>`).join('')}</div>` : ''}

      <div class="tag-section-label" style="font-size:13px;color:var(--amber)">⚠️ 需要處理（${attention.length}）</div>
      ${attention.map(x => reviewItemHtml(x.it, x.idx)).join('') || '<div class="tag-empty" style="margin-bottom:10px">沒有需要特別處理的項目</div>'}
      <button type="button" style="${btn};margin-bottom:18px" onclick="reviewAddCustom()">＋ 新增自訂需求</button>

      <div class="tag-section-label" style="font-size:13px">💰 加價需求（${priced.length}）</div>
      ${priced.map(x => reviewItemHtml(x.it, x.idx)).join('') || '<div class="tag-empty" style="margin-bottom:10px">無</div>'}

      <div class="tag-section-label" style="font-size:13px;cursor:pointer;margin-top:8px" onclick="reviewToggleBasic()">✓ 基本包含（${basic.length}）　<span style="font-weight:400;color:var(--ink-30)">${reviewBasicOpen ? '收合' : '預設皆為納入，點此展開檢視'}</span></div>
      ${reviewBasicOpen ? basic.map(x => reviewBasicRowHtml(x.it, x.idx)).join('') : ''}

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;border-top:1px solid var(--ink-10);padding-top:14px">
        <button type="button" class="btn-save" onclick="confirmRequirements()">確認需求</button>
        <button type="button" style="${btn}" onclick="saveReviewDraft()">儲存工作稿</button>
        <button type="button" style="${btn};color:var(--red)" onclick="discardReviewDraft()">${confirmed ? '放棄這次修改' : '刪除工作稿'}</button>
        <span id="reviewSaveState" style="font-size:12px;color:var(--ink-30)">${reviewDirty ? '尚未儲存' : ''}</span>
      </div>`;
  } else if (confirmed) {
    const hasQuotation = (q.quotationItems || []).length > 0;
    const accepted = q.quotationStatus === 'accepted';
    body = `
      ${confirmedHeader}
      ${reviewSummaryHtml(confirmed.summary)}
      ${hasQuotation ? `
      <div style="background:var(--amber-light);border:1px solid #fde68a;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#92400e;line-height:1.7">
        本案件已有正式報價明細。需求確認不會自動覆寫現有報價。
        ${accepted
          ? '<div style="font-size:12px">正式報價已由客戶接受，無法重新產生。</div>'
          : `<div style="margin-top:6px"><a href="quote-edit.html?id=${encodeURIComponent(currentId)}&regen=1" style="${btn};display:inline-block;text-decoration:none">依確認需求重新產生報價草稿 →</a></div>`}
      </div>` : `
      <div style="margin-bottom:14px"><a href="quote-edit.html?id=${encodeURIComponent(currentId)}" style="${btn};display:inline-block;text-decoration:none">依確認需求建立正式報價 →</a></div>`}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" style="${btn}" onclick="reviewToggleConfirmed()">${reviewConfirmedOpen ? '收合正式需求' : '查看正式需求'}</button>
        <button type="button" style="${btn}" onclick="reviewToggleReopen()">重新開啟審核</button>
      </div>
      ${reviewReopenOpen ? `
      <div style="border:1.5px solid var(--ink-10);border-radius:10px;padding:12px 14px;margin-top:12px">
        <div style="font-size:13px;color:var(--ink-60);line-height:1.6;margin-bottom:8px">重新開啟會建立新的工作稿（第 ${Number(confirmed.revision) + 1} 版）。目前有效的正式需求會保持不變，直到你再次確認。</div>
        <select class="field-select" id="rv-reopen-reason" style="max-width:260px;margin-bottom:8px">
          <option value="">請選擇理由</option>
          ${NicocoReview.REOPEN_REASONS.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}
        </select>
        <input class="field-input" id="rv-reopen-note" placeholder="補充說明（選擇「其他」時必填）" style="margin-bottom:8px">
        <button type="button" class="btn-save" onclick="reopenRequirementReview()">確定重新開啟</button>
      </div>` : ''}
      ${reviewConfirmedOpen ? reviewReadonlyListHtml(confirmed) : ''}`;
  } else {
    body = `
      <div style="font-size:13px;color:var(--ink-60);line-height:1.6;margin-bottom:14px">
        狀態：<strong style="color:var(--ink)">尚未審核</strong>。開始後系統會把客戶原始需求整理成審核項目，你可以決定每一項要納入、排除，並寫下正式需求描述。客戶原始需求不會被修改。
      </div>
      <button type="button" class="btn-save" onclick="startRequirementReview()">開始需求審核</button>`;
  }
  el.innerHTML = `<div class="card"><div class="card-title">需求審核</div>${body}</div>`;
}

// ══════════════════════════════════════════════════
//  PROJECT SCOPE & PROGRESS TRACKING v1
//  Quote → Scope（quotes/{id}/scopes/{scopeId}）→ Task（quotes/{id}/tasks/{taskId}）
//  用 subcollection 儲存，避免單一 quote 文件因 Task 數量增加而無限膨脹；
//  舊報價沒有 project 欄位時完全不受影響（backward compatible）。
// ══════════════════════════════════════════════════

// ── 依報價內容產生預設 Scope 清單（僅在建立專案時執行一次，之後由管理者人工調整）──
function buildDefaultScopeList(q) {
  const list = [];
  const added = new Set();
  function addScope(name, conceptKey, tpl, sourceQuoteItem) {
    if (added.has(conceptKey)) return;
    added.add(conceptKey);
    list.push({ name, tpl, source: 'initial_scope', sourceQuoteItem: sourceQuoteItem || null });
  }

  // 1) 不論網站類型，一律加入的基礎骨架
  UNIVERSAL_BASE_SCOPE.forEach(b => addScope(b.name, b.conceptKey, b.tpl));

  const allNames = [...(q.includedItems || []), ...(q.selectedItems || [])];

  // 2)「基礎電商模組」在報價上是一筆，但在 Scope 上拆成多個獨立項目
  //    （方案已包含、不另計價，但仍然是正式 Scope 的一部分）
  if (allNames.includes('基礎電商模組')) {
    ECOM_BASE_SCOPE_BUNDLE.forEach(b => addScope(b.name, b.conceptKey, b.tpl, '基礎電商模組'));
  }
  if (allNames.includes('後台管理入口')) {
    addScope('後台管理入口', 'admin_login', 'admin_login', '後台管理入口');
  }

  // 3) 其餘方案已包含 + 加選功能，逐一對照 Scope Template（是否計價 ≠ 是否屬於 Scope）
  allNames.forEach(name => {
    const map = SCOPE_TASK_TEMPLATE_MAP[name];
    if (!map) return;
    addScope(name, map.conceptKey, map.tpl, name);
  });

  // 4) 需評估功能：各自產生佔位 Scope，展開後為「需求訪談與技術評估」樣板，
  //    因為這些項目的實際範圍需人工確認後才能定案
  (q.evaluationItems || []).forEach(name => {
    addScope(name, 'eval_' + name, 'evaluate_complex', name);
  });

  return list;
}

// ── 從報價建立專案：寫入 project 欄位 + 產生預設 Scope（不自動展開 Task）──
async function createProjectFromQuote() {
  if (!currentId || !currentData) return;
  if (!confirm('確定要從此報價建立專案嗎？系統會依網站類型與已選功能自動產生預設工作範圍，建立後仍可人工新增／修改／刪除。')) return;

  try {
    const scopes = buildDefaultScopeList(currentData);
    const scopeColl = db.collection('quotes').doc(currentId).collection('scopes');
    const batch = db.batch();

    scopes.forEach((s, idx) => {
      const ref = scopeColl.doc();
      batch.set(ref, {
        name: s.name,
        description: '',
        source: s.source,
        crId: null,
        sourceQuoteItem: s.sourceQuoteItem,
        active: true,
        includeInProgress: true,
        order: (idx + 1) * 10,
        taskTemplateKey: s.tpl || null,
        tasksGenerated: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });

    batch.update(db.collection('quotes').doc(currentId), {
      project: {
        status: 'planning',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      },
    });

    await batch.commit();
    currentData.project = { status: 'planning' };
    showToast(`✓ 專案已建立，已產生 ${scopes.length} 項預設工作範圍`);
    await renderProjectSection();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 建立專案失敗：${err.message || err}`);
  }
}

// ── 載入並渲染專案管理區塊（backward compatible：沒有 project 欄位時顯示建立按鈕）──
// ══════════════════════════════════════════════════
//  一次性 Template Task Migration（僅依 templateTaskKey 精準比對）
//  用途：已經有 templateTaskKey 的既有 Task，套用本次明確的 Template 校正（改名 / 調整 milestone）。
//  與 LEGACY_NAME_ALIASES / resolveLegacyTemplateTaskKey() 用途不同、互不取代：
//  那一套是給「還沒有 templateTaskKey」的舊 Task 在展開 Scope 時做 dedup／補寫 key；
//  這一套是給「已經有 templateTaskKey」的 Task 做一次性欄位校正。
// ══════════════════════════════════════════════════
const TASK_TEMPLATE_MIGRATION_ID = 'task_template_calibration_20260720_v1';

// 只列出「這次要精準更新」的 templateTaskKey → 欄位 patch。
// 只會更新這裡明確列出的欄位，progress/status/weight/order/phase/active/source/crId/
// notes/waitingFor/blockedReason/description 一律不動。
const TASK_TEMPLATE_MIGRATION_PATCH = {
  payment_sandbox:         { name: '金流 Sandbox／測試環境串接' },
  payment_callback:        { requiredByMilestone: 2 },
  payment_order_status:    { requiredByMilestone: 2 },
  payment_production_test: { name: '金流 Production 實單流程測試' },
  launch_adv_06:           { name: 'Production Smoke Test' },
};

// 執行一次性 migration（若尚未執行過）。只依 templateTaskKey 精準識別要更新的 Task；
// 找不到對應 key 的直接跳過，不猜測；templateTaskKey === null（管理者自訂 Task）完全不處理。
async function runTaskTemplateMigrationIfNeeded() {
  const proj = currentData.project || {};
  const migrations = proj.migrations || {};
  if (migrations[TASK_TEMPLATE_MIGRATION_ID]) return; // 已執行過，不重複寫入 Firestore

  const quoteRef = db.collection('quotes').doc(currentId);
  const taskColl = quoteRef.collection('tasks');
  // 使用 dot-notation 路徑做安全的 nested field update，只會寫入這一個 migration key，
  // 不會覆蓋 project 底下其他既有欄位（包含其他未來的 migrations）。
  const markerPatch = {
    [`project.migrations.${TASK_TEMPLATE_MIGRATION_ID}`]: true,
    'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
  };

  try {
    const tasksToPatch = projectTasks.filter(t => t.templateTaskKey && TASK_TEMPLATE_MIGRATION_PATCH[t.templateTaskKey]);

    if (tasksToPatch.length) {
      const batch = db.batch();
      tasksToPatch.forEach(t => {
        const patch = TASK_TEMPLATE_MIGRATION_PATCH[t.templateTaskKey];
        batch.update(taskColl.doc(t.id), {
          ...patch,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      });
      batch.update(quoteRef, markerPatch);
      await batch.commit();

      // 寫入成功後才同步 local state，避免要重新整理頁面才看到新值
      tasksToPatch.forEach(t => Object.assign(t, TASK_TEMPLATE_MIGRATION_PATCH[t.templateTaskKey]));
    } else {
      // 這個 Project 目前沒有符合的 Task，也要留下 marker，避免每次載入都重新掃描
      await quoteRef.update(markerPatch);
    }

    currentData.project = currentData.project || {};
    currentData.project.migrations = currentData.project.migrations || {};
    currentData.project.migrations[TASK_TEMPLATE_MIGRATION_ID] = true;
  } catch (err) {
    // Migration 失敗不影響既有資料正常顯示，僅記錄；下次載入會再嘗試（因為 marker 尚未寫入）
    console.error('Task template migration failed:', err);
  }
}

// ══════════════════════════════════════════════════
//  一次性 Migration #2：商品系統／商品管理後台 Scope 職責校正
//  獨立於 task_template_calibration_20260720_v1，不重用、不修改該 migration。
//  只依 templateTaskKey 精準識別，不做 Task 名稱模糊比對。
// ══════════════════════════════════════════════════
const PRODUCT_SCOPE_MIGRATION_ID = 'product_scope_task_calibration_20260720_v1';

async function runProductScopeMigrationIfNeeded() {
  const proj = currentData.project || {};
  const migrations = proj.migrations || {};
  if (migrations[PRODUCT_SCOPE_MIGRATION_ID]) return; // 已執行過，不重複寫入 Firestore

  const quoteRef = db.collection('quotes').doc(currentId);
  const taskColl = quoteRef.collection('tasks');
  const markerPatch = {
    [`project.migrations.${PRODUCT_SCOPE_MIGRATION_ID}`]: true,
    'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
  };

  try {
    // 用 templateTaskKey 精準定位，不依賴 Task 顯示名稱
    const crudTask  = projectTasks.find(t => t.templateTaskKey === 'ecom_product_06'); // 舊「商品 CRUD 後台」
    const imageTask = projectTasks.find(t => t.templateTaskKey === 'ecom_product_05'); // 「商品圖片管理」
    // 用 Scope 的 taskTemplateKey（而非顯示名稱）找到「商品管理後台」Scope
    const pmScope = projectScopes.find(s => s.taskTemplateKey === 'product_mgmt');

    const batch = db.batch();
    let writeCount = 0;
    const localPatches = []; // 記錄成功後要同步回 local projectTasks 的變更

    // 1) 商品管理後台的細分 Tasks 若已存在，才將舊「商品 CRUD 後台」設為 active=false（不刪除、不動 status/progress）
    if (crudTask && pmScope) {
      const pmHasCoreTasks = projectTasks.some(t =>
        t.scopeId === pmScope.id && ['product_mgmt_01','product_mgmt_02','product_mgmt_03'].includes(t.templateTaskKey)
      );
      if (pmHasCoreTasks && crudTask.active !== false) {
        batch.update(taskColl.doc(crudTask.id), { active: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        writeCount++;
        localPatches.push({ task: crudTask, patch: { active: false } });
      }
    }

    // 2) 「商品圖片管理」若還在商品系統 Scope，且商品管理後台 Scope 存在，才搬移 scopeId（只動 scopeId，其餘欄位不動）
    //    找不到商品管理後台 Scope 時完全跳過此步驟，不移動、不建立、不刪除，保留原資料。
    if (imageTask && pmScope && imageTask.scopeId !== pmScope.id) {
      batch.update(taskColl.doc(imageTask.id), { scopeId: pmScope.id, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      writeCount++;
      localPatches.push({ task: imageTask, patch: { scopeId: pmScope.id } });
    }

    // 3) 調整商品管理後台這 5 個 Task 的 Order（只動 order，只針對這 5 個明確的 templateTaskKey）
    if (pmScope) {
      const pm01 = projectTasks.find(t => t.templateTaskKey === 'product_mgmt_01');
      const pm02 = projectTasks.find(t => t.templateTaskKey === 'product_mgmt_02');
      const pm03 = projectTasks.find(t => t.templateTaskKey === 'product_mgmt_03');
      const pm04 = projectTasks.find(t => t.templateTaskKey === 'product_mgmt_04');
      const orderTargets = [
        { task: pm01, order: 10 },
        { task: pm02, order: 20 },
        { task: imageTask, order: 30 },
        { task: pm03, order: 40 },
        { task: pm04, order: 50 },
      ];
      orderTargets.forEach(({ task, order }) => {
        if (task && task.order !== order) {
          batch.update(taskColl.doc(task.id), { order, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          writeCount++;
          localPatches.push({ task, patch: { order } });
        }
      });
    }

    batch.update(quoteRef, markerPatch);
    await batch.commit();

    // Firestore 成功後才同步 local state
    localPatches.forEach(({ task, patch }) => Object.assign(task, patch));

    currentData.project = currentData.project || {};
    currentData.project.migrations = currentData.project.migrations || {};
    currentData.project.migrations[PRODUCT_SCOPE_MIGRATION_ID] = true;
  } catch (err) {
    console.error('Product scope migration failed:', err);
  }
}

  if (!currentData.project) {
    el.innerHTML = `

          此案件尚未建立專案。建立後系統會依網站類型與已選功能自動產生預設工作範圍，之後可再展開為開發工作項目並追蹤進度。
          <br><span style="font-size:12px">建議順序是報價接受、合約簽署後再建立專案（僅為建議，不會限制操作）。建立專案後，這裡會依序出現「7 分期收款與專案執行」與「8 驗收與結案」。</span>
        </div>
        <button class="btn-save" onclick="createProjectFromQuote()">從此報價建立專案</button>

  el.innerHTML = `<div class="card"><div class="card-title">專案管理</div><div class="loading-state" style="padding:40px 0"><div class="spinner"></div>載入專案資料中…</div></div>`;

  try {
    const [scopeSnap, taskSnap, paymentSnap, crSnap] = await Promise.all([
      db.collection('quotes').doc(currentId).collection('scopes').orderBy('order').get(),
      db.collection('quotes').doc(currentId).collection('tasks').get(),
      db.collection('quotes').doc(currentId).collection('paymentMilestones').orderBy('order').get(),
      db.collection('quotes').doc(currentId).collection('changeRequests').get(),
    ]);
    projectScopes = scopeSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    projectTasks  = taskSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    paymentMilestones = paymentSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    changeRequests = crSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    await runTaskTemplateMigrationIfNeeded();
    await runProductScopeMigrationIfNeeded();
    renderProjectUI();

    // 若已啟用 Payment Milestone，在「案件管理」卡片的 paymentStatus 欄位下方補一段小提示（不動舊欄位本身）
    const noticeEl = document.getElementById('paymentStatusNotice');

      noticeEl.innerHTML = paymentMilestones.length
        ? `<div style="font-size:11px;color:var(--amber);margin-top:6px">此專案已啟用分期付款，付款明細請以分期付款為準。</div>`
        : '';
    }
  } catch (err) {
    console.error(err);
    el.innerHTML = `<div class="card"><div class="card-title">專案管理</div><div class="error-state">⚠ 讀取專案資料失敗：${escapeHtml(err.message || String(err))}</div></div>`;
  }
}

// ── 進度計算：Σ(Weight×Progress) ÷ Σ(Weight)，僅計入 active 且 includeInProgress 的項目 ──
// ── 防呆：無效 weight（<=0／NaN／Infinity）視為 0（不計入分子分母）；
//    無效 progress 一律 clamp 到 0～100，避免舊資料造成 NaN / Infinity / 超過 100% ──
function safeWeight(t) {
  const w = Number(t.weight);
  return (Number.isFinite(w) && w > 0) ? w : 0;
}
function safeProgress(t) {
  const p = Number(t.progress);
  if (!Number.isFinite(p)) return 0;
  return Math.max(0, Math.min(100, p));
}

function computeProjectMetrics() {
  const scopeById = {};
  projectScopes.forEach(s => { scopeById[s.id] = s; });

  const counted = projectTasks.filter(t => {
    if (t.active === false) return false;
    const scope = scopeById[t.scopeId];
    if (scope && (scope.active === false || scope.includeInProgress === false)) return false;
    return true;
  });

  function weightedPct(tasks) {
    const totalWeight = tasks.reduce((sum, t) => sum + safeWeight(t), 0);
    if (totalWeight === 0) return 0;
    const done = tasks.reduce((sum, t) => sum + safeWeight(t) * safeProgress(t), 0);
    return done / totalWeight;
  }

  const overall = weightedPct(counted);
  const byPhase = {};
  PHASES.forEach(p => { byPhase[p] = weightedPct(counted.filter(t => Number(t.phase) === p)); });

  const totalWeight = counted.reduce((sum, t) => sum + safeWeight(t), 0);
  const waitingWeight = counted.filter(t => t.status === 'waiting_client').reduce((sum, t) => sum + safeWeight(t), 0);
  const waitingClientPct = totalWeight ? (waitingWeight / totalWeight) * 100 : 0;

  const blocked = counted.filter(t => t.status === 'blocked');

  const statusCounts = {};
  TASK_STATUS_ORDER.forEach(s => { statusCounts[s] = counted.filter(t => t.status === s).length; });

  // Milestone Readiness：completed ≠ progress=100（開發完成 ≠ 已完成驗收），status 才是判斷依據
  const milestoneReadiness = MILESTONES.map(m => {
    const required = counted.filter(t => Number(t.requiredByMilestone || t.phase) <= m);
    const completed = required.filter(t => t.status === 'completed');
    const inReview  = required.filter(t => t.status === 'review');
    const remaining = required.length - completed.length - inReview.length;
    return {
      milestone: m,
      required: required.length,
      completed: completed.length,
      inReview: inReview.length,
      remaining,
      ready: completed.length === required.length, // 全部 required task 都必須是 completed 狀態，review 不算
    };
  });

  return { overall, byPhase, waitingClientPct, blocked, statusCounts, milestoneReadiness, totalTasks: counted.length, totalScopes: projectScopes.length };
}

function scopeProgress(scopeId) {
  const tasks = projectTasks.filter(t => t.scopeId === scopeId && t.active !== false);
  const totalWeight = tasks.reduce((sum, t) => sum + safeWeight(t), 0);
  if (totalWeight === 0) return 0;
  const done = tasks.reduce((sum, t) => sum + safeWeight(t) * safeProgress(t), 0);
  return done / totalWeight;
}

function renderScopeRow(s) {
  const taskCount = projectTasks.filter(t => t.scopeId === s.id).length;
  const isActive = s.active !== false;
  const includeProgress = s.includeInProgress !== false;

  // A) active===false → 顯示「已停用」，不顯示正常百分比
  // B) active===true 且 includeInProgress===false → 仍計算並顯示 Scope 自己的百分比，但標示「不計入總進度」
  // C/D) Task active 過濾已在 scopeProgress() 內處理
  const progressDisplay = !isActive
    ? '已停用'
    : `${scopeProgress(s.id).toFixed(1)}%`;

  // fallback 顯示未知/人工寫入的 source 值時，一律 escape 後才插入 innerHTML，避免 XSS
  const sourceLabel = escapeHtml(SCOPE_SOURCE_LABELS[s.source] || s.source || '');

  const detailKey = scopeDetailKey(s.id);
  const expanded = collapsedGroups.has(detailKey);

  return `
    <div style="border:1.5px solid var(--ink-10);border-radius:var(--r);padding:12px 14px;margin-bottom:8px${!isActive ? ';opacity:.6' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;cursor:pointer" onclick="toggleGroupCollapse('${detailKey}')">
        <div style="flex:1;min-width:180px">
          <div style="font-size:13.5px;font-weight:600;color:var(--ink)">
            <span style="font-size:10px;color:var(--ink-30);margin-right:4px;display:inline-block;width:10px">${expanded ? '▼' : '▶'}</span>
            ${escapeHtml(s.name)}
            <span class="dtag" style="margin-left:6px" title="來源">${sourceLabel}</span>
            ${!isActive ? '<span class="dtag" style="background:#fef2f2;color:var(--red)">已停用</span>' : ''}
            ${isActive && !includeProgress ? '<span class="dtag" style="background:var(--amber-light);color:var(--amber)">不計入總進度</span>' : ''}
          </div>
          <div style="font-size:11px;color:var(--ink-60);margin-top:4px">工作項目數：${taskCount}　範圍進度：${progressDisplay}</div>
        </div>
      </div>

      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--ink-10)">
        ${s.description ? `<div style="font-size:12px;color:var(--ink-60);margin-bottom:8px">${escapeHtml(s.description)}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn-copy-link" onclick="expandScopeToTasks('${s.id}')">展開成開發任務</button>
          <button class="btn-copy-link" onclick="editScopeField('${s.id}')">編輯</button>
          <button class="btn-copy-link" onclick="toggleScopeFlag('${s.id}','active',${isActive})">${!isActive ? '啟用' : '停用'}</button>
          <button class="btn-copy-link" onclick="toggleScopeFlag('${s.id}','includeInProgress',${includeProgress})">${!includeProgress ? '計入總進度' : '不計入總進度'}</button>
          <button class="btn-copy-link" style="color:var(--red)" onclick="deleteScope('${s.id}')">刪除</button>
        </div>
      </div>` : ''}
    </div>`;
}

function renderPhaseTaskGroup(phase, m) {
  const tasksInPhase = projectTasks.filter(t => Number(t.phase) === phase);
  if (!tasksInPhase.length) return '';

  const phaseKey = 'phase_' + phase;
  const phaseCollapsed = collapsedGroups.has(phaseKey);
  const phaseProgress = (m && m.byPhase[phase]) || 0;

  // 依現有 scopeId 關聯資料分組（不依 Task 顯示名稱猜測），並依 Scope 目前既有順序排列；
  // 找不到對應 Scope（理論上不會發生，因刪除 Scope 會一併刪除其 Task）者歸入「未分類」保底顯示。
  const seenScopeIds = new Set(tasksInPhase.map(t => t.scopeId));
  const orderedScopeIds = projectScopes.map(s => s.id).filter(id => seenScopeIds.has(id));
  const unknownScopeIds = [...seenScopeIds].filter(id => !orderedScopeIds.includes(id));

  const scopeGroupsHtml = [...orderedScopeIds, ...unknownScopeIds].map(scopeId => {
    const scope = projectScopes.find(s => s.id === scopeId);
    const groupTasks = tasksInPhase.filter(t => t.scopeId === scopeId).sort((a,b) => (a.order||0) - (b.order||0));
    const scopeGroupKey = 'scope_' + phase + '_' + scopeId;
    const scopeCollapsed = collapsedGroups.has(scopeGroupKey);
    const scopeName = scope ? scope.name : '未分類（原工作範圍已不存在）';
    // Scope Overall Progress：該 Scope 在整個 Project 中所有 active Task 的整體進度，
    // 同一 Scope 出現在不同 Phase 時顯示相同數值，避免互相矛盾（沿用既有 scopeProgress()）
    const scopeOverall = scope ? scopeProgress(scopeId) : 0;

    return `
      <div style="margin-left:16px;margin-bottom:6px;border-left:2px solid var(--ink-10);padding-left:12px">
        <div style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 0" onclick="toggleGroupCollapse('${scopeGroupKey}')">
          <span style="font-size:10.5px;color:var(--ink-30);width:12px;flex-shrink:0">${scopeCollapsed ? '▶' : '▼'}</span>
          <span style="font-size:12.5px;font-weight:600;color:var(--ink)">${escapeHtml(scopeName)}</span>
          <span style="font-size:11px;color:var(--ink-60)">${groupTasks.length} 項｜${scopeOverall.toFixed(1)}%</span>
        </div>
        ${scopeCollapsed ? '' : groupTasks.map(renderTaskRow).join('')}
      </div>`;
  }).join('');

  return `
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:7px 0;border-bottom:1.5px solid var(--ink-10)" onclick="toggleGroupCollapse('${phaseKey}')">
        <span style="font-size:12px;color:var(--ink-30);width:14px;flex-shrink:0">${phaseCollapsed ? '▶' : '▼'}</span>
        <span class="tag-section-label" style="margin:0;padding:0;border:none">${PHASE_LABELS[phase]}</span>
        <span style="font-size:11.5px;color:var(--ink-60)">${tasksInPhase.length} 項｜${phaseProgress.toFixed(1)}%</span>
      </div>
      ${phaseCollapsed ? '' : scopeGroupsHtml}
    </div>`;
}

      ${t.status === 'blocked' ? `

// ══════════════════════════════════════════════════
//  EXISTING PROJECT INITIALIZATION v1
//  「初始化既有專案進度／批次調整 Task 狀態」
//  只能操作「目前已存在」的 Task 的 Status／Progress（必要時 waitingFor／blockedReason）。
//  不建立 Scope、不展開 Task、不動 Weight/Order/Phase/Milestone、不影響報價。
//  所有操作先在 initPanel.draft（純前端 local state）修改，按「確認套用」才寫 Firestore，
//  且只送出「實際有變更」的 Task，欄位範圍與正式 Task Editor 一致（不引入第二套邏輯）。
// ══════════════════════════════════════════════════

function openInitPanel() {
  const draft = {};
  projectTasks.forEach(t => {
    if (t.active === false) return; // 預設不處理已停用 Task（十八）
    draft[t.id] = {
      status: t.status || 'not_started',
      progress: Number.isFinite(Number(t.progress)) ? Number(t.progress) : 0,
      waitingFor: t.waitingFor || '',
      blockedReason: t.blockedReason || '',
    };
  });
  initPanel = { open: true, step: 'edit', draft };
  renderProjectUI();
}

function closeInitPanel() {
  initPanel = { open: false, step: 'edit', draft: {} };
  renderProjectUI();
}

function initSetTaskField(taskId, field, value) {
  if (!initPanel.draft[taskId]) return;
  initPanel.draft[taskId][field] = value;
  renderProjectUI();
}

// 套用單一 Task 的批次動作到 Draft（不觸碰 Firestore）
function initApplyBulkToTask(taskId, action) {
  const d = initPanel.draft[taskId];
  if (!d) return;
  if (action === 'completed')       { d.status = 'completed';   d.progress = 100; }
  else if (action === 'not_started') { d.status = 'not_started'; d.progress = 0; }
  else if (action === 'in_progress') { d.status = 'in_progress'; /* progress 保留原值，不猜測 */ }
}

function initBulkPhase(phase, action) {
  projectTasks
    .filter(t => Number(t.phase) === phase && t.active !== false && initPanel.draft[t.id])
    .forEach(t => initApplyBulkToTask(t.id, action));
  renderProjectUI();
}

// Scope 批次操作：影響該 Scope「所有」目前既有 Task，不論分散在哪個 Phase
function initBulkScope(scopeId, action) {
  projectTasks
    .filter(t => t.scopeId === scopeId && t.active !== false && initPanel.draft[t.id])
    .forEach(t => initApplyBulkToTask(t.id, action));
  renderProjectUI();
}

// 只有「Draft 與目前 Firestore 實際值不同」才算變更，避免把沒動過的 Task 也送去 update
function initComputeChanges() {
  const changes = [];
  Object.keys(initPanel.draft).forEach(taskId => {
    const t = projectTasks.find(x => x.id === taskId);
    if (!t) return;
    const d = initPanel.draft[taskId];
    const origStatus = t.status || 'not_started';
    const origProgress = Number.isFinite(Number(t.progress)) ? Number(t.progress) : 0;
    const origWaiting = t.waitingFor || '';
    const origBlocked = t.blockedReason || '';

    const statusChanged   = d.status !== origStatus;
    const progressChanged = Number(d.progress) !== origProgress;
    const waitingChanged  = d.status === 'waiting_client' && d.waitingFor !== origWaiting;
    const blockedChanged  = d.status === 'blocked' && d.blockedReason !== origBlocked;

    if (statusChanged || progressChanged || waitingChanged || blockedChanged) {
      changes.push({ taskId, task: t, draft: d });
    }
  });
  return changes;
}

function initGoPreview() { initPanel.step = 'preview'; renderProjectUI(); }
function initBackToEdit() { initPanel.step = 'edit'; renderProjectUI(); }

async function initConfirmApply() {
  const changes = initComputeChanges();
  if (!changes.length) { closeInitPanel(); return; }
  if (!confirm(`確定要批次更新 ${changes.length} 個工作項目的狀態與進度嗎？\n此操作不會修改權重、排序、階段、里程碑，也不會修改正式報價。`)) return;

  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const taskColl = quoteRef.collection('tasks');
    const batch = db.batch();

    changes.forEach(c => {
      const payload = {
        status: c.draft.status,
        progress: c.draft.progress,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      // 僅在對應狀態時才更新 waitingFor / blockedReason，維持與正式 Task Editor 一致的欄位範圍
      if (c.draft.status === 'waiting_client') payload.waitingFor = c.draft.waitingFor || null;
      if (c.draft.status === 'blocked')        payload.blockedReason = c.draft.blockedReason || null;
      batch.update(taskColl.doc(c.taskId), payload);
    });

    // 使用安全的 nested field update，不覆蓋整個 project object；
    // 第一次成功記錄 initialProgressInitializedAt，之後都記錄 lastBulkTaskUpdateAt（可重複使用，非一次性鎖）
    const isFirstTime = !(currentData.project && currentData.project.initialProgressInitializedAt);
    const markerField = isFirstTime ? 'initialProgressInitializedAt' : 'lastBulkTaskUpdateAt';
    batch.update(quoteRef, {
      [`project.${markerField}`]: firebase.firestore.FieldValue.serverTimestamp(),
      'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
    });

    await batch.commit();

    // Firestore 成功後才同步正式 local projectTasks（避免假成功）
    changes.forEach(c => {
      const t = projectTasks.find(x => x.id === c.taskId);
      if (!t) return;
      t.status = c.draft.status;
      t.progress = c.draft.progress;
      if (c.draft.status === 'waiting_client') t.waitingFor = c.draft.waitingFor || null;
      if (c.draft.status === 'blocked')        t.blockedReason = c.draft.blockedReason || null;
    });
    currentData.project = currentData.project || {};
    currentData.project[markerField] = true;

    showToast(`✓ 已更新 ${changes.length} 個工作項目`);
    initPanel = { open: false, step: 'edit', draft: {} };
    renderProjectUI(); // 沿用既有 Progress / Milestone Readiness 計算邏輯，不建立第二套公式
  } catch (err) {
    console.error(err);
    showToast(`⚠ 批次更新失敗：${err.message || err}`);
    // 失敗：不關閉 Panel、不清空 Draft，保留讓使用者重試，也不動正式 local projectTasks
  }
}

// ── 展開 Scope 成 Development Tasks（依 Task Template；已展開過則需確認是否再次生成）──
// ── Legacy Compatibility：舊版 Task 可能沒有 templateTaskKey（v1 尚未加入穩定 key 前生成的資料）。
//    優先用 templateTaskKey 比對；沒有的話，才用 Task Name 對照該 Scope 的樣板做「一次性」fallback。
//    對上了就回傳 key（呼叫端會把它寫回 Firestore，完成 migration）；對不上就回傳 null，
//    視為管理者自訂 / 已改名的 custom Task，不猜測、不覆蓋、不刪除。
// 本輪 Template 校正時被改名的項目：舊名稱 → 對應既有 stable templateTaskKey。
// 僅供尚未完成 templateTaskKey migration 的 legacy Task 使用，明確表列、非模糊字串比對。
const LEGACY_NAME_ALIASES = {
  '測試環境串接': 'payment_sandbox',
  '正式環境測試': 'payment_production_test',
  'Production 測試': 'launch_adv_06',
  // Pricing v2 的 Scope 校正（只改樣板任務名稱；已生成的 Task 不會被改寫）
  '點數或分級邏輯': 'member_advanced_02',
  '發送排程設定': 'newsletter_03',
  '出貨標籤產生': 'logistics_03',
  '金流正式環境切換': 'launch_adv_03',
};

function resolveLegacyTemplateTaskKey(task, template) {
  if (task.templateTaskKey) return task.templateTaskKey;
  if (!template) return null;
  // 1) 用目前 Template 的 name 完全比對
  const match = template.find(t => t.name === task.name);
  if (match) return match.key;
  // 2) 本輪改名前的舊名稱 alias（明確表列，非模糊比對），避免因 rename 誤判成自訂 Task 而重複生成
  const aliasKey = LEGACY_NAME_ALIASES[task.name];
  if (aliasKey && template.some(t => t.key === aliasKey)) return aliasKey;
  return null;
}

async function expandScopeToTasks(scopeId) {
  const scope = projectScopes.find(s => s.id === scopeId);
  if (!scope) return;

  const tpl = TASK_TEMPLATES[scope.taskTemplateKey] || TASK_TEMPLATES.minor_addon;
  const existingTasks = projectTasks.filter(t => t.scopeId === scopeId);

  let mode = 'add'; // 尚未展開過：直接視為「新增全部」，等同於補齊缺少的（現有為 0 項）
  if (scope.tasksGenerated || existingTasks.length) {
    // 三種行為概念：取消／僅新增缺少的預設 Tasks（推薦）／強制重新生成完整一套
    const choice = prompt(
      '此工作範圍已存在開發工作項目。\n' +
      '輸入 "add" ：僅新增缺少的預設工作項目（推薦，不會重複建立）\n' +
      '輸入 "force"：強制重新生成完整一套樣板工作項目（不會刪除既有項目，但可能產生重複）\n' +
      '留空或取消：不執行任何動作',
      'add'
    );
    if (choice === null) return;
    const normalized = choice.trim().toLowerCase();
    if (normalized !== 'add' && normalized !== 'force') { showToast('已取消，未輸入有效指令'); return; }
    mode = normalized;
    if (mode === 'force') {
      if (!confirm('確定要強制重新生成完整一套工作項目？既有項目不會被刪除，但這會建立一批新的重複樣板任務，請確認這是你要的操作。')) return;
    }
  }

  // 「僅新增缺少的」：比對 templateTaskKey；沒有 templateTaskKey 的舊 Task 用 Task Name 對照樣板做
  // 一次性 legacy migration（對上了會在下方 batch 中把 templateTaskKey 補寫回 Firestore）。
  // 管理者自行建立、或已改名對不上樣板的 Task，templateTaskKey 保持 null，視為 custom/manual Task，不受影響。
  const existingKeys = new Set();
  const legacyMigrations = []; // { taskId, key }
  existingTasks.forEach(t => {
    const resolved = resolveLegacyTemplateTaskKey(t, tpl);
    if (!resolved) return;
    existingKeys.add(resolved);
    if (!t.templateTaskKey) legacyMigrations.push({ taskId: t.id, key: resolved });
  });

  const tasksToCreate = (mode === 'add') ? tpl.filter(t => !existingKeys.has(t.key)) : tpl;

  if (mode === 'add' && tasksToCreate.length === 0 && legacyMigrations.length === 0) {
    showToast('此工作範圍的預設工作項目皆已存在，未新增任何項目');
    return;
  }

  const existingMaxOrder = existingTasks.reduce((mx, t) => Math.max(mx, t.order || 0), 0);

  try {
    const taskColl = db.collection('quotes').doc(currentId).collection('tasks');
    const batch = db.batch();
    const newTasks = [];

    tasksToCreate.forEach((t, idx) => {
      const ref = taskColl.doc();
      const data = {
        scopeId,
        templateTaskKey: t.key || null,
        name: t.name,
        description: '',
        category: t.category || '',
        weight: t.weight,
        phase: t.phase,
        order: existingMaxOrder + (idx + 1) * 10,
        requiredByMilestone: t.milestone || t.phase,
        status: 'not_started',
        progress: 0,
        active: true,
        source: scope.source || 'initial_scope',
        crId: scope.crId || null,
        waitingFor: null,
        blockedReason: null,
        notes: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      batch.set(ref, data);
      newTasks.push({ id: ref.id, ...data });
    });

    // 補寫舊 Task 的 templateTaskKey，完成 migration，之後就能完全依穩定 key 判斷
    legacyMigrations.forEach(mig => {
      batch.update(taskColl.doc(mig.taskId), {
        templateTaskKey: mig.key,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });

    batch.update(db.collection('quotes').doc(currentId).collection('scopes').doc(scopeId), {
      tasksGenerated: true,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });

    await batch.commit();
    scope.tasksGenerated = true;
    projectTasks.push(...newTasks);
    legacyMigrations.forEach(mig => {
      const t = projectTasks.find(pt => pt.id === mig.taskId);
      if (t) t.templateTaskKey = mig.key;
    });
    const migrationNote = legacyMigrations.length ? `，並補齊 ${legacyMigrations.length} 項舊工作項目的樣板對應` : '';
    showToast(`✓ 已產生 ${newTasks.length} 項開發任務${migrationNote}`);
    renderProjectUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 展開任務失敗：${err.message || err}`);
  }
}

// ── Scope CRUD ──
async function addManualScope() {
  const nameEl = document.getElementById('new-scope-name');
  const sourceEl = document.getElementById('new-scope-source');
  const name = (nameEl.value || '').trim();
  if (!name) { showToast('請輸入工作範圍名稱'); return; }

  try {
    const maxOrder = projectScopes.reduce((mx, s) => Math.max(mx, s.order || 0), 0);
    const ref = db.collection('quotes').doc(currentId).collection('scopes').doc();
    const data = {
      name, description: '', source: sourceEl.value, crId: null, sourceQuoteItem: null,
      active: true, includeInProgress: true, order: maxOrder + 10,
      taskTemplateKey: 'minor_addon', tasksGenerated: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    await ref.set(data);
    projectScopes.push({ id: ref.id, ...data });
    nameEl.value = '';
    showToast('✓ 已新增工作範圍');
    renderProjectUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 新增工作範圍失敗：${err.message || err}`);
  }
}

async function editScopeField(scopeId) {
  const scope = projectScopes.find(s => s.id === scopeId);
  if (!scope) return;
  const newName = prompt('工作範圍名稱：', scope.name);
  if (newName === null) return;
  const newDesc = prompt('工作範圍描述（可留空）：', scope.description || '');
  if (newDesc === null) return;
  try {
    await db.collection('quotes').doc(currentId).collection('scopes').doc(scopeId).update({
      name: newName.trim() || scope.name,
      description: newDesc,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    scope.name = newName.trim() || scope.name;
    scope.description = newDesc;
    showToast('✓ 已更新工作範圍');
    renderProjectUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 更新失敗：${err.message || err}`);
  }
}

async function toggleScopeFlag(scopeId, field, currentVal) {
  const scope = projectScopes.find(s => s.id === scopeId);
  if (!scope) return;
  const newVal = !currentVal;
  try {
    await db.collection('quotes').doc(currentId).collection('scopes').doc(scopeId).update({
      [field]: newVal,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),

function validateTaskField(field, value) {
  if (field === 'weight') {
    if (!Number.isFinite(value) || value <= 0) return '權重必須為大於 0 的數字';
  }
  if (field === 'progress') {
    if (!Number.isFinite(value) || value < 0 || value > 100) return '進度必須為 0～100 之間的數字';
  }
  if (field === 'order') {
    if (!Number.isFinite(value) || value < 0 || !Number.isInteger(value)) return '排序必須為 0 以上的整數';
  }
  if (field === 'phase') {
    if (!PHASES.includes(Number(value))) return '階段必須為 1～3';
  }
  if (field === 'requiredByMilestone') {
    if (!MILESTONES.includes(Number(value))) return '所屬里程碑必須為 1～3';
  }
  return null;
}

// ══════════════════════════════════════════════════
//  PAYMENT MILESTONE v1
//  quotes/{quoteId}/paymentMilestones/{paymentId}
//  與 Phase／Development Milestone／Task Progress 完全獨立；不因任何狀態自動改為 paid。
//  沿用既有 activityLogs（type:'payment'），不建立第二套紀錄系統。
// ══════════════════════════════════════════════════

const PAYMENT_PLAN_PRESETS = {
  full:         { label:'一次付清（100%）',      items:[{ title:'全額付款', percentage:100 }] },
  half2:        { label:'兩期付款（50/50）',      items:[{ title:'啟動款', percentage:50 }, { title:'尾款', percentage:50 }] },
  third_403030: { label:'三期付款（40/30/30）',   items:[{ title:'啟動款', percentage:40 }, { title:'第二期款', percentage:30 }, { title:'尾款', percentage:30 }] },
  third_304030: { label:'三期付款（30/40/30）',   items:[{ title:'啟動款', percentage:30 }, { title:'第二期款', percentage:40 }, { title:'尾款', percentage:30 }] },
  custom:       { label:'自訂',                   items:[{ title:'第一期款', percentage:100 }] },
};

// ── contractAmount 決定：優先沿用已快照的 project.contractAmount；
//    尚未建立過付款計畫時，用 quotationTotal || officialPrice（與 dashboard.html 的 wonAmount() 優先序一致）──
function resolveContractAmount() {
  if (currentData.project && Number(currentData.project.contractAmount) > 0) {
    return Number(currentData.project.contractAmount);
  }
  return Number(currentData.quotationTotal || currentData.officialPrice || 0);
}

// ── Rounding：前 N-1 期依比例四捨五入，最後一期吸收差額，確保加總與 contractAmount 完全相等 ──
function calcPaymentAmounts(contractAmount, items) {
  const amounts = [];
  let runningSum = 0;
  for (let i = 0; i < items.length - 1; i++) {
    const amt = Math.round(contractAmount * Number(items[i].percentage) / 100);
    amounts.push(amt);
    runningSum += amt;
  }
  amounts.push(contractAmount - runningSum); // 最後一期吸收 rounding difference
  return amounts;
}

function validatePaymentPlanDraft() {
  if (!paymentPlanBuilder || !paymentPlanBuilder.items.length) return '請至少設定一筆付款節點';
  if (paymentPlanBuilder.items.some(i => !(Number(i.percentage) > 0))) return '每筆付款比例必須大於 0';
  if (paymentPlanBuilder.items.some(i => !i.title || !i.title.trim())) return '每筆付款節點都需要名稱';
  const sum = paymentPlanBuilder.items.reduce((s, i) => s + (Number(i.percentage) || 0), 0);
  if (Math.abs(sum - 100) > 0.001) return `付款比例加總必須為 100%（目前為 ${sum}%）`;
  return null;
}

// ── 共用 local-date helper：用瀏覽器本地時區產生 YYYY-MM-DD，避免 UTC+8 凌晨用 toISOString() 判斷成前一天 ──
function getLocalDateStr(d) {
  const date = d instanceof Date ? d : new Date();
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// ── 驗證 YYYY-MM-DD 字串是否為「真實存在」的日期（例如 2026-02-30、2026-99-99 必須拒絕）──
// 用 round-trip 檢查：組出 Date 後年/月/日必須跟輸入完全一致，才代表沒有被 JS Date 自動進位/溢位吸收掉。
function isValidCalendarDateStr(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
  if (!m) return false;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return false;
  const dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
}

// ── 付款摘要顯示用的「目前應收總額」基準：優先用 project.currentContractValue（未來 CR 核准後才會出現），
//    沒有的話 fallback 回 project.contractAmount（原始合約金額快照），都沒有則 0。
//    注意：這跟 resolveContractAmount() 語意不同——
//    resolveContractAmount() 是「第一次建立付款計畫時」決定要快照哪個金額（quotationTotal/officialPrice）；
//    resolvePaymentContractValue() 是「顯示付款摘要時」決定目前應該拿哪個金額當基準，兩者不要混用。
function resolvePaymentContractValue() {
  const proj = currentData.project;
  if (proj && Number(proj.currentContractValue) > 0) return Number(proj.currentContractValue);
  if (proj && Number(proj.contractAmount) > 0) return Number(proj.contractAmount);
  return 0;
}

function computePaymentSummary() {
  const contractAmount = resolvePaymentContractValue();
  const paid = paymentMilestones.filter(p => p.status === 'paid').reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const rawBalance = contractAmount - paid;
  const remaining = Math.max(rawBalance, 0);
  const overpaid = Math.max(-rawBalance, 0);
  const todayStr = getLocalDateStr();
  const overdue = paymentMilestones
    .filter(p => p.status === 'pending' && p.dueDate && p.dueDate < todayStr)
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const allPaid = paymentMilestones.length > 0 && paymentMilestones.every(p => p.status === 'paid');
  const pendingWithDue = paymentMilestones
    .filter(p => p.status !== 'paid' && p.dueDate)
    .sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0));

  let nextDue = null; // null=尚未設定, 'DONE'=已全部完成, 否則為該筆付款物件
  if (allPaid) nextDue = 'DONE';
  else if (pendingWithDue.length) nextDue = pendingWithDue[0];

  return { contractAmount, paid, remaining, overpaid, overdue, nextDue, allPaid };
}

// ── 確認建立付款計畫：唯一會把 Payment Milestone 寫入 Firestore 的地方 ──
async function createPaymentPlan() {
  const validationErr = validatePaymentPlanDraft();
  if (validationErr) { showToast(`⚠ ${validationErr}`); return; }

  const contractAmount = resolveContractAmount();
  if (!(contractAmount > 0)) {
    showToast('尚未設定有效的正式合約金額，請先完成正式報價或設定正式報價金額。');
    return;
  }

  const items = paymentPlanBuilder.items;
  if (!confirm(`確定要建立付款計畫嗎？\n合約金額 NT$${contractAmount.toLocaleString()}，共 ${items.length} 期。`)) return;

  const amounts = calcPaymentAmounts(contractAmount, items);

  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const pmColl = quoteRef.collection('paymentMilestones');
    const batch = db.batch();
    const newDocs = [];

    items.forEach((item, idx) => {
      const ref = pmColl.doc();
      const data = {
        order: idx,
        title: item.title.trim(),
        percentage: Number(item.percentage),
        amount: amounts[idx],
        dueDate: null,
        status: 'pending',
        paidAt: null,
        note: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      batch.set(ref, data);
      newDocs.push({ id: ref.id, ...data });
    });

    const planSummary = items.map(i => `${i.percentage}%`).join(' / ');
    const newLog = {
      id: genActivityId(),
      type: 'payment',
      content: `建立付款計畫：${planSummary}，合約金額 NT$${contractAmount.toLocaleString()}`,
      createdAt: firebase.firestore.Timestamp.now(),
      createdBy: 'me',
    };

    batch.update(quoteRef, {
      'project.contractAmount': contractAmount,
      'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog),
    });

    await batch.commit();

    // Firestore 成功後才同步 local state
    paymentMilestones = newDocs;
    currentData.project = currentData.project || {};
    currentData.project.contractAmount = contractAmount;
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);

    paymentPlanBuilder = null;
    showToast('✓ 已建立付款計畫');
    renderProjectUI();
    syncTimelineUI();
    const noticeEl = document.getElementById('paymentStatusNotice');
    if (noticeEl) noticeEl.innerHTML = `<div style="font-size:11px;color:var(--amber);margin-top:6px">此專案已啟用分期付款，付款明細請以分期付款為準。</div>`;
  } catch (err) {
    console.error(err);
    showToast(`⚠ 建立付款計畫失敗：${err.message || err}`);
  }
}

// ── 渲染：Payment Milestones 卡片（Project 未建立時完全不顯示）──
function renderPaymentSection() {
  if (!currentData.project) return '';

  if (paymentPlanBuilder) return renderPaymentPlanBuilder();

  if (!paymentMilestones.length) {
    return `
      <div class="card">
        <div class="card-title">分期付款</div>
        <div style="font-size:12px;color:var(--ink-60);margin-bottom:12px">尚未建立付款計畫。</div>
        <button class="btn-save" onclick="openPaymentPlanBuilder()">建立付款計畫</button>
      </div>`;
  }

  const summary = computePaymentSummary();
  const todayStr = getLocalDateStr();
  const sorted = [...paymentMilestones].sort((a, b) => (a.order || 0) - (b.order || 0));

  // Next Due 文案修正：所有「目前已存在」的 Payment Milestone 都 paid 時，
  // 若 remaining 仍 > 0（例如 CR 已核准但尚未建立追加付款），不應該誤導顯示「已全部完成」，
  // 改為明確提示還有多少錢尚未安排付款節點；純文案/判斷調整，不建立任何新 Payment Milestone。
  const nextDueText = summary.allPaid
    ? (summary.remaining === 0 ? '已全部完成' : `尚有 NT$${summary.remaining.toLocaleString()} 未安排付款`)
    : (summary.nextDue && summary.nextDue !== 'DONE')
      ? `${escapeHtml(summary.nextDue.title)}（${summary.nextDue.dueDate}）`
      : '尚未設定';

  return `
    <div class="card">
      <div class="card-title">分期付款</div>

      <div class="info-grid" style="margin-bottom:14px">
        <div class="info-box"><div class="info-label">目前合約總額</div><div class="info-value">NT$${summary.contractAmount.toLocaleString()}</div></div>
        <div class="info-box"><div class="info-label">已收款</div><div class="info-value" style="color:var(--green)">NT$${summary.paid.toLocaleString()}</div></div>
        <div class="info-box"><div class="info-label">未收款</div><div class="info-value">NT$${summary.remaining.toLocaleString()}</div></div>
        <div class="info-box"><div class="info-label">逾期金額</div><div class="info-value" style="color:${summary.overdue > 0 ? 'var(--red)' : 'var(--ink)'}">NT$${summary.overdue.toLocaleString()}</div></div>
        ${summary.overpaid > 0 ? `<div class="info-box" style="background:var(--amber-light)"><div class="info-label" style="color:#92400e">溢收／待退款</div><div class="info-value" style="color:#92400e">NT$${summary.overpaid.toLocaleString()}</div></div>` : ''}
        <div class="info-box" style="grid-column:1/-1"><div class="info-label">下一筆到期</div><div class="info-value" style="font-size:14px">${nextDueText}</div></div>
      </div>

      ${sorted.map(p => renderPaymentMilestoneRow(p, todayStr)).join('')}
    </div>`;
}

function renderPaymentMilestoneRow(p, todayStr) {
  const isOverdue = p.status === 'pending' && p.dueDate && p.dueDate < todayStr;
  const statusLabel = p.status === 'paid' ? '已付款' : '待付款';
  const statusColor = p.status === 'paid' ? 'var(--green)' : (isOverdue ? 'var(--red)' : 'var(--ink-60)');
  return `
    <div style="border:1.5px solid var(--ink-10);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:160px">
          <div style="font-size:13px;font-weight:600;color:var(--ink)">${escapeHtml(p.title)}
            <span class="dtag" style="margin-left:6px;color:${statusColor}">${statusLabel}</span>
            ${isOverdue ? '<span class="dtag" style="background:#fef2f2;color:var(--red)">已逾期</span>' : ''}
          </div>
          <div style="font-size:11px;color:var(--ink-60);margin-top:3px">
            ${p.percentage}%　NT$${(Number(p.amount) || 0).toLocaleString()}　到期日：${p.dueDate ? escapeHtml(p.dueDate) : '未設定'}
          </div>
          ${p.note ? `<div style="font-size:11px;color:var(--ink-60);margin-top:2px">備註：${escapeHtml(p.note)}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${p.status === 'pending'
            ? `<button class="btn-copy-link" onclick="markPaymentPaid('${p.id}')">標記已付款</button>`
            : `<button class="btn-copy-link" onclick="markPaymentPending('${p.id}')">改回待付款</button>`}
          <button class="btn-copy-link" onclick="editPaymentMilestone('${p.id}')">編輯</button>
        </div>
      </div>
    </div>`;
}

//  ACCEPTANCE & WARRANTY v1
//  存在 project.acceptance / project.warranty（沿用既有 quote 文件的 project 欄位，不新增 collection）。
//  流程：未送驗 → 送出驗收 → 驗收中 → 完成驗收 → 保固開始 → 保固到期。
//  Bug／驗收問題只記 note／Timeline；超出 Scope 的新需求仍走既有 Change Request，不混成同一套資料。
// ══════════════════════════════════════════════════

const ACCEPTANCE_STATUS_LABELS = { not_started: '未送驗', in_review: '驗收中', accepted: '已完成驗收' };
const WARRANTY_STATUS_LABELS   = { not_started: '尚未開始', active: '保固中', expired: '已到期' };

// ── 送出驗收：not_started → in_review。若仍有未完成 Task 只提示，不硬性阻止。──
async function submitForAcceptance() {
  if (!currentData.project) { showToast('⚠ 尚未建立專案，無法送出驗收'); return; }
  const current = currentData.project.acceptance || { status: 'not_started' };
  if (current.status !== 'not_started') { showToast('⚠ 此專案已經送出過驗收'); return; }

  const incompleteCount = projectTasks.filter(t => t.active !== false && t.status !== 'completed').length;
  const warnMsg = incompleteCount > 0 ? `目前仍有 ${incompleteCount} 個工作項目尚未完成，` : '';
  const dueDateInput = prompt(`${warnMsg}確定要送出驗收嗎？\n可設定預計驗收期限（格式 YYYY-MM-DD，留空可略過）：`, '');
  if (dueDateInput === null) return;
  const trimmed = dueDateInput.trim();
  if (trimmed && !isValidCalendarDateStr(trimmed)) { showToast('⚠ 日期格式需為 YYYY-MM-DD 且必須是真實存在的日期'); return; }

  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const acceptance = { status: 'in_review', submittedAt: firebase.firestore.FieldValue.serverTimestamp(), dueDate: trimmed || null, acceptedAt: null, note: current.note || '' };
    const newLog = {
      id: genActivityId(), type: 'acceptance',
      content: `已送出驗收${trimmed ? `，預計期限 ${trimmed}` : ''}${incompleteCount > 0 ? `（尚有 ${incompleteCount} 個工作項目未完成）` : ''}`,
      createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me',
    };
    const batch = db.batch();
    batch.update(quoteRef, {
      'project.status': 'review',
      'project.acceptance': acceptance,
      'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog),
    });
    await batch.commit();

    currentData.project.status = 'review';
    currentData.project.acceptance = { ...acceptance, submittedAt: firebase.firestore.Timestamp.now() };
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);
    showToast('✓ 已送出驗收');
    renderProjectUI();
    syncTimelineUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 更新失敗：${err.message || err}`);
  }
}

// ── 完成驗收：in_review → accepted，以 acceptedAt 為基準開始保固（durationDays 預設 30，可人工修改，
//    不從 Agreement warrantyPolicy 文字自動解析）。──
async function completeAcceptance() {
  if (!currentData.project) return;
  const acceptance = currentData.project.acceptance;
  if (!acceptance || acceptance.status !== 'in_review') { showToast('⚠ 目前不是「驗收中」狀態'); return; }

  const durationInput = prompt('確定要標記完成驗收嗎？\n請設定保固天數（預設 30 天）：', '30');
  if (durationInput === null) return;
  const durationDays = parseInt(durationInput, 10);
  if (!Number.isFinite(durationDays) || durationDays <= 0) { showToast('⚠ 保固天數必須是大於 0 的整數'); return; }

  const startDateStr = getLocalDateStr();
  const endDateObj = new Date(startDateStr + 'T00:00:00');
  endDateObj.setDate(endDateObj.getDate() + durationDays);
  const endDateStr = getLocalDateStr(endDateObj);

  try {
    const quoteRef = db.collection('quotes').doc(currentId);
    const acceptedAtLocal = firebase.firestore.Timestamp.now();
    const newAcceptanceForFirestore = { ...acceptance, status: 'accepted', acceptedAt: firebase.firestore.FieldValue.serverTimestamp() };
    const newWarranty = { status: 'active', startDate: startDateStr, endDate: endDateStr, durationDays, note: (currentData.project.warranty && currentData.project.warranty.note) || '' };
    const newLog = {
      id: genActivityId(), type: 'acceptance',
      content: `驗收完成，保固期 ${durationDays} 天（${startDateStr} ～ ${endDateStr}）`,
      createdAt: acceptedAtLocal, createdBy: 'me',
    };

    const batch = db.batch();
    batch.update(quoteRef, {
      'project.acceptance': newAcceptanceForFirestore,
      'project.warranty': newWarranty,
      'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog),
    });
    await batch.commit();

    currentData.project.acceptance = { ...acceptance, status: 'accepted', acceptedAt: acceptedAtLocal };
    currentData.project.warranty = newWarranty;
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);
    showToast('✓ 驗收完成，保固已開始');
    renderProjectUI();
    syncTimelineUI();
  } catch (err) {
    console.error(err);
    showToast(`⚠ 更新失敗：${err.message || err}`);
  }
}

// ── 標記保固到期：純人工動作，系統不會自動把 Project 設為 completed，也不會自動改寫此欄位 ──
async function markWarrantyExpired() {
  if (!currentData.project || !currentData.project.warranty) return;

    const batch = db.batch();
    batch.update(quoteRef, {
      'project.warranty.status': 'expired',
      'project.updatedAt': firebase.firestore.FieldValue.serverTimestamp(),
      activityLogs: firebase.firestore.FieldValue.arrayUnion(newLog),
    });
    await batch.commit();
    currentData.project.warranty.status = 'expired';
    if (!currentData.activityLogs) currentData.activityLogs = [];
    currentData.activityLogs.push(newLog);
